<svg xmlns="http://www.w3.org/2000/svg" width="72" height="52" viewBox="0 0 72 52" fill="none">
  <!--
    Аркатурный пояс — ряд глухих арок. Это подлинный декоративный мотив
    грузинской храмовой архитектуры (Светицховели, Самтависи, Ананури),
    и, в отличие от лозы, он состоит из чистой геометрии: полуокружность
    заданного радиуса и две вертикали. Такое код рисует безупречно.

    Плитка бесшовная: базовая линия проходит через весь тайл,
    арка вписана с равными отступами по краям.
  -->
  <g stroke="#000" stroke-width="1.5" stroke-linecap="square">
    <!-- арка: пролёт 48, радиус 24, пяты на y=44 -->
    <path d="M12 44V28a24 24 0 0 1 48 0v16"/>
    <!-- база -->
    <path d="M0 44h72"/>
    <!-- капитель: короткие полки в основании арки -->
    <path d="M8 28h8M56 28h8"/>
  </g>
</svg>
