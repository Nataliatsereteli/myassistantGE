<svg xmlns="http://www.w3.org/2000/svg" width="300" height="200" viewBox="0 0 300 200" fill="#000">
  <!--
    Флаг Грузии, стилизованный: пять крестов, только геометрия.
    Пропорции 3:2, толщина ветвей большого креста — 1/5 высоты, как в оригинале.
    Малые кресты даны упрощённо (расширяющиеся ветви, прямые грани):
    точная болнисская форма с вогнутыми дугами на таком масштабе
    и такой прозрачности всё равно не читается, а прямые грани
    остаются безупречно ровными при любом искажении «ветром».

    Файл используется как МАСКА — цвет задаётся в CSS и следует теме.
  -->

  <!-- большой крест святого Георгия -->
  <rect x="0" y="80" width="300" height="40"/>
  <rect x="130" y="0" width="40" height="200"/>

  <!-- четыре малых креста в углах -->
  <g>
    <path d="M-7-7-16-26h32l-9 19 19-9v32l-19-9 9 19h-32l9-19-19 9v-32z" transform="translate(65 40)"/>
    <path d="M-7-7-16-26h32l-9 19 19-9v32l-19-9 9 19h-32l9-19-19 9v-32z" transform="translate(235 40)"/>
    <path d="M-7-7-16-26h32l-9 19 19-9v32l-19-9 9 19h-32l9-19-19 9v-32z" transform="translate(65 160)"/>
    <path d="M-7-7-16-26h32l-9 19 19-9v32l-19-9 9 19h-32l9-19-19 9v-32z" transform="translate(235 160)"/>
  </g>
</svg>
