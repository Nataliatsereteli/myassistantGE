name: Проверка правок

# Запускается на каждый pull request. Смысл простой: если в YAML появилась
# опечатка или в одном из языков забыли перевести услугу — это видно ДО того,
# как правка попадёт на живой сайт.
on:
  pull_request:
    branches: [main]
  workflow_dispatch: {}

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Структура переводов совпадает с русским оригиналом
        run: python scripts/assemble_i18n.py --check en ka

      - name: Контент корректен
        run: python build.py --check

      - name: Сайт собирается
        run: python build.py

      - name: Ссылки, микроразметка и мета-теги на месте
        run: python scripts/verify_build.py
