# =============================================================================
#  КОНТАКТЫ — единственное место, где они указаны.
#  Меняете номер здесь — он меняется в шапке, подвале, на странице контактов,
#  в кнопке WhatsApp, в микроразметке для Google и в кнопке «написать».
# =============================================================================

# Телефон в международном формате. Пробелы можно ставить как удобно —
# для ссылок tel: и wa.me они убираются автоматически.
phone: "+995 557 638 067"

# WhatsApp. Если пусто — берётся номер из phone.
whatsapp: ""
show_whatsapp: true

# Telegram — только имя пользователя, без @ и без ссылки.
telegram: "nataliatsereteli"

email: "natatsereteli81@gmail.com"

# --- Где вы находитесь -------------------------------------------------------
# Город пишется в content/i18n/*.yml -> contacts.city (он переводится).
# Здесь — только то, что не зависит от языка.
street: ""                          # можно оставить пустым, если приём по записи
postal_code: ""

# Координаты для микроразметки и карты. Если не нужны — оставьте пусто.
geo:
  lat: ""
  lng: ""

# Ссылка на точку в Google Maps (кнопка «построить маршрут»).
map_url: ""

# Города, в которых вы работаете — попадают в микроразметку areaServed.
cities_served:
  - "Tbilisi"
  - "Batumi"

# --- Часы работы -------------------------------------------------------------
# Формат для Google. Дни: Monday, Tuesday, Wednesday, Thursday, Friday,
# Saturday, Sunday. Время — 24-часовое.
hours:
  - days: [Monday, Tuesday, Wednesday, Thursday, Friday]
    opens: "10:00"
    closes: "19:00"
  - days: [Saturday]
    opens: "11:00"
    closes: "16:00"

# --- Соцсети -----------------------------------------------------------------
# Пустые строки не выводятся. Полные адреса, со https://
socials:
  instagram: ""
  facebook: ""
  linkedin: ""
