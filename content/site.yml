# =============================================================================
#  ГЛАВНЫЕ НАСТРОЙКИ САЙТА
#  Здесь живёт всё, что не является текстом: адрес сайта, бренд, аналитика,
#  форма заявки. Тексты — в content/i18n/*.yml, цены — в content/pricing.yml,
#  контакты — в content/contacts.yml.
#
#  После любой правки этого файла сайт пересоберётся автоматически
#  (GitHub Actions) и обновится через 1–2 минуты.
# =============================================================================

# --- Адрес сайта -------------------------------------------------------------
# url — полный адрес без слэша на конце. Используется в canonical, sitemap,
# микроразметке и ссылках для соцсетей. ОБЯЗАТЕЛЕН и должен быть точным,
# иначе поисковики будут индексировать неверные адреса.
url: "https://myassistant.ge"

# custom_domain — собственный домен для GitHub Pages. Если оставить пустым,
# сайт будет жить по адресу вида username.github.io/repo.
# При заполнении файл CNAME создаётся автоматически при сборке.
custom_domain: "myassistant.ge"

# base_path — если сайт живёт НЕ в корне домена, а в подпапке.
# Примеры: "" (обычный случай, свой домен), "/myassistantGE" (GitHub Pages
# без своего домена: nataliatsereteli.github.io/myassistantGE), "/demo" (подпапка
# на своём сервере). Слэш в начале, без слэша в конце.
#
# ВАЖНО: имя репозитория пишется ТОЛЬКО здесь. В url его быть не должно,
# иначе префикс удвоится и сайт не соберётся.
base_path: ""

# Пока сайт не готов к публикации — поставьте false: тогда на всех страницах
# появится noindex и robots.txt закроет сайт от поисковиков.
#
# СЕЙЧАС false СОЗНАТЕЛЬНО. Включить true нужно, когда будут готовы:
#   - фотография владелицы (brand.photo ниже),
#   - реквизиты ИП (legal.entity_name и legal.tax_id ниже).
# Причина: пока адреса страниц и тексты могут поменяться, лучше не пускать
# поисковики — иначе в выдаче останутся ссылки на несуществующие страницы.
allow_indexing: false

# --- Языки -------------------------------------------------------------------
# Порядок в списке = порядок переключателя языков в шапке.
languages: [ru, en, ka]

# Язык, на который уводит корневая страница, если язык браузера не распознан.
default_language: ru

# hreflang="x-default" — версия «для всех остальных». Обычно английская.
x_default: en

language_names:
  ru: "Русский"
  en: "English"
  ka: "ქართული"

# Коротко — для переключателя в шапке.
language_codes:
  ru: "RU"
  en: "EN"
  ka: "ქარ"

locales:
  ru: "ru_RU"
  en: "en_US"
  ka: "ka_GE"

# --- Бренд -------------------------------------------------------------------
brand:
  # Название, которое видно в шапке и в заголовках вкладок.
  name: "MyAssistant"

  # Имя владельца латиницей — для микроразметки и подписи на латинице.
  # Локализованные варианты — в content/i18n/<язык>.yml -> meta.owner_name.
  owner_name: "Natalia Tsereteli"

  # Монограмма в рамке под фотографию. Это инициалы владелицы,
  # а не бренда: в рамке будет её портрет.
  monogram: "NT"

  # Фотография для блока «обо мне». Положить файл в assets/img/
  # и указать путь, например "/assets/img/nata.jpg".
  # Пока пусто — в рамке показывается монограмма.
  photo: ""

  # Диапазон цен для Google (₾ = лари). Влияет на карточку в поиске и картах.
  price_range: "₾₾"

# --- Юридические данные ------------------------------------------------------
legal:
  # Наименование ИП ровно как в выписке из реестра. Попадает в микроразметку
  # (schema.org legalName), в подвал и в публичную оферту, поэтому должно
  # совпадать с документом буквально. Не переводится на другие языки.
  entity_name: "ИП Наталья Церетели"   # ЗАПОЛНИТЬ: точное наименование из выписки
  tax_id: ""                            # ID номер (საიდენტიფიკაციო კოდი), можно оставить пустым
  registered_country: "GE"

# --- Форма заявки ------------------------------------------------------------
# Сайт статический, поэтому форма отправляется через внешний сервис.
# Рекомендуется Web3Forms: бесплатно, без регистрации сервера,
# ключ получают на https://web3forms.com (письма приходят на вашу почту).
#
# provider: web3forms | formspree | none
#   none  — форма не выводится вообще, вместо неё показываются прямые контакты.
forms:
  provider: "none"
  # Для web3forms сюда вставляется access key, для formspree — полный URL формы.
  endpoint: ""
  access_key: ""
  # Куда вести после успешной отправки (страница «спасибо» строится сама).
  redirect_to_thanks: true

# --- Аналитика ---------------------------------------------------------------
# provider: none | plausible | umami | ga4
# Plausible и Umami не требуют баннера про cookies — они не ставят cookies.
analytics:
  provider: "none"
  domain: ""                # для plausible: myassistant.ge
  script: "https://plausible.io/js/script.js"
  website_id: ""            # для umami
  measurement_id: ""        # для ga4: G-XXXXXXXXXX

# --- Подтверждение прав в поисковиках ----------------------------------------
# Коды из Google Search Console и Яндекс.Вебмастера.
verification:
  google: ""
  yandex: ""

# --- Что показывать ----------------------------------------------------------
# Быстрые переключатели, чтобы включать и выключать блоки без правки шаблонов.
features:
  show_prices: true             # показывать цены публично
  show_faq_on_home: true
  show_process_on_home: true
  show_floating_button: true
  show_language_notice: true    # подсказка «эта страница есть на вашем языке»
