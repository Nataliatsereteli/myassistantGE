  description: >-
    Персональный менеджер по административным вопросам в Грузии: ВНЖ,
    регистрация ИП, разрешение на работу, банковский счёт, налоги.
    Фиксированные цены в лари.
  job_title: "Персональный менеджер по административным вопросам"
  audience: "Иностранные граждане, живущие или планирующие переезд в Грузию"
  choose_language: "Выберите язык"
  owner_name: "Наталья Церетели"

  # Факты под портретом: появятся, когда список заполнится.
  # Формат: {k: "лет в Грузии", v: "12"}. Пока пусто — блок не показывается.
  owner_facts: []
  photo_alt: >-
    Наталья Церетели, персональный менеджер по административным вопросам в Грузии
  # Текст на картинке для соцсетей (генерируется scripts/make_images.py).
