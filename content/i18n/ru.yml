        a: >-
          Это разные процедуры, но они часто идут вместе, и порядок имеет
          значение. На консультации я скажу, что в вашем случае логичнее
          делать первым.
      - q: "Кому нужно право на трудовую деятельность?"
        a: >-
          Требование действует с 1 марта 2026 года и касается иностранцев
          без постоянного ВНЖ, которые работают или ведут предпринимательскую
          деятельность на территории Грузии: наёмных сотрудников грузинских
          компаний, ИП и фрилансеров. Оно не распространяется на обладателей
          постоянного и инвестиционного ВНЖ, беженцев и лиц под международной
          защитой, аккредитованных дипломатов и журналистов. Для отдельных
          занятий — курьеров, водителей такси, гидов — действуют годовые квоты.
      - q: "Сколько стоит госуслуга и сколько ждать решения?"
        a: >-
          Обычный порядок — 200 ₾ и до 30 календарных дней, ускоренный —
          400 ₾ и до 10 рабочих дней. Это пошлина Агентства занятости,
          отдельная от стоимости сопровождения. За наёмного сотрудника
          заявление подаёт и пошлину платит работодатель, самозанятый
          подаёт и платит сам.
      - q: "Что будет, если работать без ПТД?"
        a: >-
          Штраф 2000 ₾ иностранцу и 2000 ₾ работодателю или организатору
          услуги — за каждого работающего без права. Для самозанятых,
          работавших в Грузии до введения правил, контроль действует
          с 1 мая 2026 года, а зарегистрированным трудовым иммигрантам
          право нужно оформить до 1 января 2027 года.
      - q: "Я ИП и работаю только с иностранными заказчиками. Мне нужно ПТД?"
        a: >-
          Самый спорный вопрос новых правил: официального разъяснения нет,
          и даже профильные юристы трактуют его по-разному. Ответ зависит
          от деталей: зарегистрирована ли деятельность в Грузии, где находятся
          заказчики, есть ли грузинский доход. На консультации разбираю
          конкретно вашу ситуацию и даю понятный план действий,
          а не универсальный совет.
      - q: "На какой срок выдают право и как его продлевают?"
        a: >-
          Первичное право выдают на срок от 6 месяцев до года,
          ИТ-специалистам — до 3 лет. Продлевают на год в течение первых
          пяти лет, дальше — до 5 лет за раз. Документы на продление подаются
          не позднее чем за 30 дней до окончания срока — напоминание об этом
          входит в сопровождение.

