  faq:
    slug: "voprosy"
    title: "Частые вопросы"
    nav_title: "Вопросы"
    kicker: "FAQ"
    seo_title: "Частые вопросы: ВНЖ, ИП и разрешение на работу в Грузии"
    seo_description: >-
      Отвечаю на вопросы о сопровождении: гарантии, стоимость, госпошлины,
      личное присутствие, сроки рассмотрения, отказы и продление ВНЖ.
    lead: >-
      Собрала здесь то, что спрашивают до начала работы. Если вашего вопроса
      нет — напишите, добавлю.
    items:
      - q: "Вы юрист или адвокат?"
        a: >-
          Нет. Я персональный менеджер по административным вопросам:
          подготовка и подача документов, взаимодействие с государственными
          органами, контроль сроков. Правовые заключения и представительство
          в суде — работа адвоката.
      - q: "Можете ли вы гарантировать положительное решение?"
        a: >-
          Нет. Решение принимает государственный орган. Я отвечаю за качество
          подготовки: полный комплект, корректное заявление, соблюдённые сроки
          и быстрая реакция на запросы. Это то, что реально влияет на результат.
      - q: "Что входит в стоимость, а что нет?"
        a: >-
          В стоимость входит моя работа: консультация, проверка и подготовка
          документов, заполнение заявлений, взаимодействие с ведомствами,
          контроль процесса. Не входят государственные пошлины, услуги нотариуса
          и переводчика, банковские сборы — они оплачиваются отдельно
          по фактической стоимости.
      - q: "Сколько времени занимает получение ВНЖ?"
        a: >-
          Сроки рассмотрения устанавливает ведомство и они меняются, поэтому
          я не называю их «в среднем по интернету». На первой консультации
          я говорю актуальный срок для вашего основания и то, что может
          его продлить — например, запрос дополнительных документов.
      - q: "Мне отказали. Можно что-то сделать?"
        a: >-
          Часто да. Сначала нужно понять причину отказа — иногда это
          формальность в комплекте документов, иногда неподходящее основание.
          Я разбираю ситуацию и говорю, есть ли смысл подавать заново
          и что менять. Если вопрос переходит в правовую плоскость,
          подключаем адвоката.
      - q: "Можно ли всё сделать дистанционно?"
        a: >-
          Частично. Многое решается онлайн, но есть шаги, которые заявитель
          проходит лично: например, обязательное видеособеседование
          при получении права на трудовую деятельность и часть визитов
          в государственные учреждения. Я заранее говорю, где нужны именно вы.
      - q: "Что такое статус малого бизнеса с налогом 1%?"
        a: >-
          Это особый налоговый режим для индивидуальных предпринимателей
          в Грузии с оборотом ниже установленного порога. Он подходит не всем
          видам деятельности. На консультации я объясняю, попадаете ли вы под него,
          и что нужно сделать при регистрации, чтобы его получить.
      - q: "Вы помогаете с бухгалтерией и декларациями?"
        a: >-
          Я помогаю зарегистрироваться на портале Службы доходов, настроить
          личный кабинет и координирую налоговые вопросы. Регулярная
          бухгалтерия — отдельная профессия; при необходимости порекомендую
          бухгалтера.
      - q: "Работаете ли вы с семьями?"
        a: >-
          Да. В пакетах «Персональный менеджер» и «VIP-сопровождение»
          входит координация административных вопросов членов семьи —
          документы детей, супругов, сроки их разрешений.
      - q: "Как оплачивать?"
        a: >-
          Порядок оплаты обсуждается до начала работы и фиксируется в договоре.
          Для месячных пакетов оплата происходит ежемесячно, для разовых услуг —
          по согласованному графику.
      - q: "Что если мне нужна только одна процедура?"
        a: >-
          Возьмите отдельную услугу из прайса: проверка документов, заполнение
          заявления, сопровождение в госучреждение, помощь с банковским счётом.
          Пакет имеет смысл, когда задач несколько.
      - q: "Сохраняете ли вы конфиденциальность?"
        a: >-
          Да. Документы и персональные данные используются только для той
          процедуры, ради которой они переданы, и не передаются третьим лицам
          без вашего согласия — кроме случаев, когда это требуется
          законодательством.

  privacy:
    slug: "politika-konfidencialnosti"
    title: "Политика конфиденциальности"
    nav_title: "Конфиденциальность"
    seo_title: "Политика конфиденциальности"
    seo_description: >-
      Какие данные собирает сайт, зачем они нужны, сколько хранятся и кому
      передаются. Обработка персональных данных при сопровождении в Грузии.
    updated: "2026"
    body:
      - h: "Кто обрабатывает данные"
        p:
          - >-
            Сайт принадлежит индивидуальному предпринимателю,
            оказывающему услуги административного сопровождения в Грузии.
            Контактные данные указаны на странице «Контакты».
      - h: "Какие данные собираются"
        p:
          - >-
            Сайт статический и сам по себе не создаёт учётных записей
            и не хранит базу посетителей. Данные появляются только тогда,
            когда вы сами их отправляете.
        list:
          - "Имя и способ связи, если вы заполнили форму заявки"
          - "Текст вашего сообщения"
          - "Язык страницы и адрес страницы, с которой отправлена заявка"
          - "Обезличенная статистика посещений, если аналитика включена"
      - h: "Зачем"
        p:
          - >-
            Единственная цель — ответить вам и оказать услугу, о которой
            вы спрашиваете. Данные не используются для рекламы и не продаются.
      - h: "Кому передаются"
        list:
          - "Сервису отправки формы — только чтобы доставить письмо"
          - "Государственным органам, нотариусу, переводчику или банку — только в объёме, необходимом для вашей процедуры, и только с вашего согласия"
          - "Никому больше"
      - h: "Сколько хранятся"
        p:
          - >-
            Переписка и документы хранятся столько, сколько нужно
            для оказания услуги и выполнения требований законодательства,
            после чего удаляются.
      - h: "Ваши права"
        p:
          - >-
            Вы можете попросить показать, исправить или удалить свои данные —
            напишите на контактный адрес, и я это сделаю.
      - h: "Cookies"
        p:
          - >-
            Сайт не использует рекламные cookies. Выбранный язык
            сохраняется в локальном хранилище браузера, чтобы не спрашивать
            его каждый раз; это не передаётся никому.

