  # --------------------------------------------------------------- 01 -------
  start:
    slug: "start-v-gruzii"
    name: "Старт в Грузии"
    short: "Первые административные шаги: регистрация ИП и понятный план действий"
    service_type: "Регистрация индивидуального предпринимателя"
    tagline: >-
      Для тех, кто уже в Грузии и хочет закрыть первоочередные
      административные вопросы, не разбираясь в них с нуля.
    summary: >-
      Организация регистрации в качестве индивидуального предпринимателя,
      перечень необходимых документов, подготовка заявлений, взаимодействие
      с государственными органами и контроль процесса регистрации.
    seo_title: "Регистрация ИП в Грузии — сопровождение «Старт в Грузии»"
    seo_description: >-
      Регистрация индивидуального предпринимателя в Грузии: перечень
      документов, подготовка заявлений, работа с госорганами, контроль
      регистрации.
    duration: "Обычно 1–3 рабочих дня после сбора документов"
    format: "Онлайн + один визит при необходимости"
    for_whom:
      - >-
        Вы приехали в Грузию и вам нужно быстро получить легальную форму
        для работы и дохода — чаще всего это статус индивидуального
        предпринимателя.
      - >-
        Вы не хотите изучать регламенты, ездить наугад в Дом юстиции
        и выяснять на месте, какого документа не хватает.
    includes:
      - "Организация регистрации в качестве индивидуального предпринимателя (ИП)"
      - "Предоставление перечня необходимых документов под вашу ситуацию"
      - "Помощь в подготовке заявлений"
      - "Взаимодействие с соответствующими государственными органами"
      - "Контроль процесса регистрации до получения выписки"
    excludes: >-
      Государственные пошлины, услуги нотариуса и переводчика оплачиваются
      отдельно по фактической стоимости.
    steps:
      - "Короткий разговор: чем планируете заниматься и какой доход ожидаете"
      - "Список документов и что из них нужно перевести"
      - "Подготовка и подача заявления"
      - "Получение выписки и объяснение, что делать дальше"
    result: >-
      Зарегистрированный статус ИП, выписка из реестра
      и понимание следующего шага — налоги, банк или ВНЖ.
    faq:
      - q: "Нужен ли ВНЖ, чтобы открыть ИП в Грузии?"
        a: >-
          Как правило, нет: регистрация индивидуального предпринимателя
          и вид на жительство — разные процедуры. Но набор документов зависит
          от вашего статуса пребывания, поэтому его я определяю индивидуально.
      - q: "Сразу ли я получу налог 1%?"
        a: >-
          Статус малого бизнеса присваивается отдельно и не всем видам
          деятельности. Я объясняю на консультации, подходит ли он вам,
          и что для этого нужно сделать при регистрации.
      - q: "Можно ли сразу и ИП, и ВНЖ?"
        a: >-
          Да, для этого есть пакет «Бизнес / ВНЖ» — там регистрация,
          налоги, банк и заявление на ВНЖ идут одним процессом.

