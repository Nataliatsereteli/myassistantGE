  residence:
    slug: "vnzh-v-gruzii"
    name: "ВНЖ под ключ"
    short: "Полное административное сопровождение получения вида на жительство"
    service_type: "Сопровождение получения вида на жительство"
    tagline: >-
      Вы собираете личные документы — всё остальное по заявлению
      на вид на жительство делаю я.
    summary: >-
      Полное административное сопровождение процесса получения вида
      на жительство: проверка документов, подготовка заявления, организация
      перевода и нотариального заверения, взаимодействие с государственными
      органами и контроль рассмотрения.
    seo_title: "ВНЖ в Грузии под ключ — сопровождение подачи документов"
    seo_description: >-
      Вид на жительство в Грузии под ключ: проверка документов, подготовка
      заявления, перевод и нотариальное заверение, подача, контроль
      рассмотрения.
    duration: "Подготовка 3–7 дней, далее срок рассмотрения ведомства"
    format: "Онлайн + сопровождение при подаче"
    for_whom:
      - >-
        Вам нужен вид на жительство, и вы хотите, чтобы заявление ушло
        с первого раза — без возвратов из-за формы документа, перевода
        или неправильно указанного основания.
      - >-
        Или вы уже подавали самостоятельно, получили отказ и не поняли,
        что именно исправить.
    includes:
      - "Проверка необходимых документов"
      - "Подготовка заявления"
      - "Организация перевода документов и нотариального заверения"
      - "Взаимодействие с государственными органами"
      - "Сопровождение процесса подачи заявления"
      - "Контроль процесса рассмотрения заявления"
      - "Помощь в случае запроса дополнительных документов"
    excludes: >-
      Государственные пошлины, услуги переводчика, нотариуса и другие расходы
      третьих лиц в стоимость услуги не входят.
    steps:
      - "Определяем основание, по которому вам доступен ВНЖ"
      - "Проверяем комплект и находим слабые места до подачи"
      - "Переводы, нотариус, заявление"
      - "Подача и контроль до решения"
    result: >-
      Поданное заявление с полным комплектом, отслеживаемый статус
      и быстрая реакция, если ведомство запросит что-то ещё.
    note: >-
      Если по вашему основанию ВНЖ получить нельзя, я скажу об этом
      до начала работы и предложу альтернативы, а не буду подавать «на удачу».
    faq:
      - q: "Какое основание для ВНЖ подойдёт мне?"
        a: >-
          Оснований несколько — работа, учёба, бизнес, семья, недвижимость
          и другие. Что подходит именно вам, зависит от гражданства, дохода,
          семейного положения и планов. Это первое, что мы выясняем.
      - q: "Что делать, если запросили дополнительные документы?"
        a: >-
          Это нормальная часть процедуры. Я получаю запрос, объясняю, что именно
          нужно, помогаю быстро собрать и дослать — чтобы срок не сгорел.
      - q: "Входит ли продление в эту услугу?"
        a: >-
          Эта услуга покрывает одну подачу. За сроками действия я слежу
          в пакетах «Персональный менеджер» и «VIP-сопровождение»,
          либо продление можно заказать отдельно.

