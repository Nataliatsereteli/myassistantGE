cta:
  kicker: "პირველი ნაბიჯი"
  title: "მომიყევით, რა სიტუაციაა"
  lead: >-
    მომწერეთ ორიოდე სტრიქონი: მოქალაქეობა, რა არის საჭირო და რა ვადაში.
    გიპასუხებთ, რომელი საფუძველი გამოდგება, რა დაგჭირდებათ და რა ღირს.
  note: >-
    პირველი საუბარი იმისთვისაა, რომ ამოცანა გავარკვიოთ — ის არაფერს გავალდებულებთ.

