home:

  hero:
    kicker: "ნატალია წერეთელი · თბილისი"
    # <em>…</em> выделяет слово курсивом и цветом. Можно убрать.
    title: "ქართული უწყებები — <em>ჩემი</em> საქმეა. თქვენი — ცხოვრება და მუშაობა"
    lead: >-
      ბინადრობის ნებართვა, ინდმეწარმის რეგისტრაცია, შრომითი საქმიანობის უფლება,
      საბანკო ანგარიში, გადასახადები. დოკუმენტებს, უწყებებთან მიმოწერას და ვადებს
      მე ვიღებ ჩემზე — თქვენ იღებთ გასაგებ გეგმას და შედეგს.
    cta_primary: "განვიხილოთ თქვენი შემთხვევა"
    cta_secondary: "მომსახურების ნახვა"

  facts_label: "მოკლედ მუშაობის შესახებ"
  # Правая карточка в первом экране — сухие факты, снимающие первые вопросы.
  facts:
    - k: "ენები"
      v: "Русский · ქართული · English"
    - k: "ქალაქები"
      v: "თბილისი, ბათუმი"
    - k: "ფორმატი"
      v: "ონლაინ და პირადი შეხვედრები"
    - k: "ფასები"
      v: "ფიქსირებული, გამოქვეყნებული"
    - k: "პასუხი"
      v: "ჩვეულებრივ სამუშაო დღეში"

  # Текст внутри декоративной печати в первом экране.
  stamp: "საქართველო · GEORGIA ·"

  trust:
    - title: "ფასი წინასწარ ცნობილია"
      body: >-
        თითოეული მომსახურების ღირებულება გამოქვეყნებულია. სახელმწიფო ბაჟი,
        ნოტარიუსი და თარჯიმანი ცალკე და ფაქტობრივად ანაზღაურდება — მათ ყოველთვის
        ვასახელებ სამუშაოს დაწყებამდე.
    - title: "საქმეს ერთი ადამიანი უძღვება"
      body: >-
        არც ქოლ-ცენტრი და არც მენეჯერების რიგი. თავიდანვე იცით,
        ვინ უძღვება თქვენს საქმეს და ვის დაუსვათ შეკითხვა.
    - title: "სამი ენა ერთ ხელში"
      body: >-
        თქვენთან რუსულად ან ინგლისურად ვსაუბრობ, უწყებებთან — ქართულად.
        თარგმანში არაფერი იკარგება.
    - title: "ვადები კონტროლზეა"
      body: >-
        თვალს ვადევნებ ბინადრობის ნებართვის, სხვა ნებართვებისა და ხელშეკრულებების
        ვადებს და გაგრძელებაზე წინასწარ გახსენებთ, არა ბოლო კვირას.

  problem:
    kicker: "რატომ არის ეს საჭირო"
    title: "სირთულე კანონები კი არაა — ის, რომ მათზე კითხვის დასმა არსად შეიძლება"
    body:
      - >-
        საქართველოში ცხოვრების, ბიზნესის რეგისტრაციისა და დასაქმების წესები
        ზოგადად კეთილგანწყობილია უცხოელების მიმართ. მაგრამ ისინი სხვადასხვა
        უწყებაშია გაფანტული, იცვლება, ოფიციალური განმარტებები კი ქართულად გამოდის.
      - >-
        შედეგად ადამიანი კვირებს ხარჯავს ფორუმებსა და ჩატებში, აგროვებს სხვადასხვა
        დროის რჩევებს, იუსტიციის სახლში მიდის არასრული დოკუმენტებით —
        და თავიდან იწყებს.
      - >-
        ჩემი საქმეა, ეს ძებნა ერთი გასაგები მარშრუტით ჩავანაცვლო: რა გჭირდებათ
        ზუსტად თქვენს შემთხვევაში, რა თანმიმდევრობით, რა ჯდება ფაქტობრივად
        და რა ხდება განაცხადთან ახლა.
    aside_title: "რითაც ყველაზე ხშირად მომმართავენ"
    aside_items:
      - "ჩამოვედი და არ ვიცი, საიდან დავიწყო"
      - "ბინადრობის ნებართვა მჭირდება, მაგრამ არ ვიცი, რომელი საფუძველი მიდგება"
      - "უარი მითხრეს და უარში არ წერია, კონკრეტულად რა გამოვასწორო"
      - "ლეგალურად მუშაობა ან ქართულ კომპანიაში დასაქმება მჭირდება"
      - "მინდა ინდმეწარმედ დავრეგისტრირდე და 1%-იან გადასახადში გავერკვე"
      - "ბანკმა უარი მითხრა ან ანგარიშის გახსნას აჭიანურებს"
      - "ბინადრობის ნებართვა მეწურება, გაგრძელებამდე ორი კვირაა"

  services:
    kicker: "მომსახურება"
    title: "ექვსი ფორმატი — ერთი დავალებიდან სრულ თანხლებამდე"
    lead: >-
      შეგიძლიათ აიღოთ ერთი პროცედურა და დახუროთ კონკრეტული საკითხი, ან სრულად
      გადმომაბაროთ ყველა ადმინისტრაციული საქმე ყოფნის მთელი პერიოდისთვის.
    prices_cta: "სრული ფასები, ცალკეული მომსახურების ჩათვლით"

  process:
    kicker: "როგორ ვმუშაობთ"
    title: "ოთხი ნაბიჯი, შემდეგ კი — მხოლოდ ჩემი შეტყობინებები"
    lead: >-
      არავითარი „გამოგზავნეთ ყველაფერი, რაც გაქვთ, და დაელოდეთ“. ყოველ ეტაპზე
      იცით, რა ხდება და რა არის თქვენგან საჭირო.
    steps:
      - title: "ვარკვევთ სიტუაციას"
        body: >-
          30–40 წუთიანი საუბარი: მიზანი, მოქალაქეობა, ვადები, ოჯახი, სამუშაო
          და შემოსავალი. შედეგად — ნათელია, რომელი საფუძველია თქვენთვის რეალური.
      - title: "გეგმა და ხარჯთაღრიცხვა"
        body: >-
          წერილობითი მარშრუტი: დოკუმენტების ჩამონათვალი, მოქმედებების
          თანმიმდევრობა, ვადები და სრული ღირებულება, სახელმწიფო ბაჟისა და მესამე
          პირების მომსახურების ჩათვლით.
      - title: "ვამზადებთ დოკუმენტებს"
        body: >-
          ვამოწმებ თქვენს დოკუმენტებს, ვავსებ განაცხადებს, ვაწყობ თარგმანსა
          და ნოტარიულ დამოწმებას, გიწერთ მიღებაზე.
      - title: "მივყავართ შედეგამდე"
        body: >-
          ვურთიერთობ უწყებებთან, თვალს ვადევნებ განხილვას, ვრეაგირებ დამატებითი
          დოკუმენტების მოთხოვნაზე და გაცნობებთ გადაწყვეტილებას.

  about:
    kicker: "ვინ ვარ"
    title: "ნატალია წერეთელი — თქვენი კეის-მენეჯერი საქართველოში"
    body:
      - >-
        ვცხოვრობ საქართველოში და ვეწევი უცხო ქვეყნის მოქალაქეების ადმინისტრაციულ
        თანხლებას: ინდმეწარმის პირველი რეგისტრაციიდან ბინადრობის ნებართვის
        გაგრძელებამდე და უცხოელის დასაქმების საკითხებამდე.
      - >-
        მე არ ვარ იურიდიული ფირმა და არც ადვოკატი. მე ის ადამიანი ვარ, ვინც
        პრაქტიკაში იცის, როგორ მუშაობს ქართული პროცედურები: რომელ დოკუმენტს
        მიიღებენ და რომელს დააბრუნებენ; სად არის რიგი და სად ელექტრონული ჩაწერა;
        რას იკითხავენ გასაუბრებაზე.
      - >-
        ასეთი საქმე სიზუსტეზე დგას. ამიტომ ყოველ საქმეზე მაქვს დოკუმენტების
        ჩამონათვალი, თარიღები და სტატუსი — და ნებისმიერ მომენტში შეგიძლიათ
        ამის შესახებ მკითხოთ.
    points_title: "როგორ ვმუშაობ"
    points:
      - "პირდაპირ ვამბობ: თუ საკითხი ჩემ გარეშე გვარდება, ასეც გეტყვით"
      - "არ გპირდებით შედეგს, რომელიც ჩემზე არ არის დამოკიდებული"
      - "ყველა თანხას სამუშაოს დაწყებამდე ვასახელებ, არა მსვლელობისას"
      - "კლიენტების დოკუმენტები და მონაცემები ჩემს ხელს არ ტოვებს"
      - "თუ ადვოკატი ან აუდიტორი დაგჭირდებათ — გამოცდილს გირჩევთ"
    # Личная цитата под фотографией — голос владелицы, не маркетинг.
    quote: >-
      ქართული ბიუროკრატია მარტივი არ გახდება. მაგრამ მასთან მარტო აღარ დარჩებით.
    signature_caption: "ნატალია წერეთელი · თბილისი"
    cta: "ჩემ შესახებ ვრცლად"

  faq:
    kicker: "კითხვები"
    title: "რას კითხულობენ დაწყებამდე"
    all_cta: "ყველა კითხვა და პასუხი →"
    items:
      - q: "იურისტი ხართ?"
        a: >-
          არა. მე ვარ პერსონალური მენეჯერი ადმინისტრაციულ საკითხებში:
          ვამზადებ და ვაბარებ დოკუმენტებს, ვურთიერთობ უწყებებთან, ვაკონტროლებ
          ვადებს. სასამართლოში წარმომადგენლობა და სამართლებრივი დასკვნები
          ადვოკატის საქმეა და თუ დაგჭირდებათ, სპეციალისტს გირჩევთ.
      - q: "გარანტიას იძლევით, რომ ბინადრობის ნებართვა დამტკიცდება?"
        a: >-
          არა, და ვერავინ მოგცემთ: გადაწყვეტილებას სახელმწიფო უწყება იღებს.
          მე ვპასუხობ იმაზე, რაც მომზადებაზეა დამოკიდებული — პაკეტი სრული იქნება,
          განაცხადი სწორი, ვადები დაცული, უწყების მოთხოვნები კი სწრაფად
          დამუშავებული. ეს შესამჩნევად ზრდის შანსს, მაგრამ გადაწყვეტილებას არ ცვლის.
      - q: "სახელმწიფო ბაჟი და ნოტარიუსი ღირებულებაში შედის?"
        a: >-
          არა. სახელმწიფო ბაჟი, ნოტარიუსისა და თარჯიმნის მომსახურება ცალკე
          და ფაქტობრივი ღირებულებით ანაზღაურდება. ამ თანხებს წინასწარ,
          ხარჯთაღრიცხვაში ვასახელებ, რომ საბოლოო ციფრი მოულოდნელი არ იყოს.
      - q: "პირადად ჩამოსვლა მჭირდება?"
        a: >-
          პროცედურების ნაწილის დისტანციურად გავლა შესაძლებელია, მაგრამ არა
          ყველასი: მაგალითად, დასაქმების სააგენტოში დოკუმენტებს განმცხადებელი
          თავად აბარებს და სავალდებულო ვიდეო-გასაუბრებას პირადად გადის. ამ
          ნაბიჯებისთვის გამზადებთ, დანარჩენ ყველაფერს კი თავად ვუძღვები.
      - q: "რომელ ენაზე ვისაუბრებთ?"
        a: >-
          თქვენთან — რუსულად ან ინგლისურად, როგორც მოგახერხებთ. უწყებებთან,
          ნოტარიუსთან და ბანკთან — ქართულად. ჩემთან საურთიერთოდ ცალკე თარჯიმანი
          არ დაგჭირდებათ.
      - q: "შეიძლება მხოლოდ ერთი პროცედურის აღება, პაკეტის გარეშე?"
        a: >-
          დიახ. ფასებში არის ცალკეული მომსახურებები: დოკუმენტების შემოწმება,
          განაცხადის შევსება, თანხლება სახელმწიფო დაწესებულებაში, დახმარება
          საბანკო ანგარიშთან. პაკეტი უფრო მომგებიანია, როცა დავალება რამდენიმეა.

# --- Финальный блок «поговорим» (одинаковый на всех страницах) --------------
