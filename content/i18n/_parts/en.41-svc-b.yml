  manager:
    slug: "personal-manager"
    name: "Personal manager"
    short: "Monthly handling of every administrative matter, for as long as you stay"
    service_type: "Administrative support on a monthly retainer"
    tagline: >-
      You do not order services one at a time — you simply hand the
      administrative side of life in Georgia over to me.
    summary: >-
      Monthly support: dealing with government agencies, preparing documents,
      filling in applications, arranging appointments and visits, bank matters,
      coordinating taxes, tracking the expiry dates of your documents, and
      finding a translator or a lawyer if one is needed.
    seo_title: "Personal manager in Georgia — monthly admin support"
    seo_description: >-
      Monthly administrative support in Tbilisi: government offices,
      documents, bank, taxes, and deadline tracking for your residence and
      special labour permits.
    duration: "Monthly, with no cap on the number of requests under the contract"
    format: "Constant contact by messenger + meetings"
    for_whom:
      - >-
        Administrative matters keep coming up: renewals, certificates,
        tax deadlines, documents for the family, visits to the agencies.
      - >-
        You would rather have one channel and one person responsible
        than look for someone new for every task.
    includes:
      - "Dealing with the government agencies"
      - "Preparing documents"
      - "Filling in applications"
      - "Arranging appointments and visits"
      - "Sorting out anything to do with the bank"
      - "Coordinating tax matters"
      - "Tracking the expiry dates of the residence permit and other documents"
      - "Finding a translator or a lawyer where needed"
      - "Obtaining information from government agencies on the client's behalf in the cases provided for by law"
    excludes: >-
      State fees and third-party services are paid separately.
      Bookkeeping is not included.
    result: >-
      Not a single missed deadline, and one person you can write to
      about any administrative question.
    note: >-
      On a 3-month contract the rate is lower —
      the exact amounts are in the price list.
    faq:
      - q: "Is there a limit on requests?"
        a: >-
          The scope and its limits are set out in the contract, so both sides
          know what to expect. Ordinary day-to-day matters are included; large
          separate procedures (a full new residence permit, for example)
          are quoted separately.
      - q: "Can it cover the family?"
        a: >-
          Yes. Coordinating administrative matters for family members is part
          of the package — we agree who is covered at the start.
      - q: "Can I pause and come back later?"
        a: >-
          Yes, it is a monthly arrangement. The terms for pausing
          are set out in the contract.

