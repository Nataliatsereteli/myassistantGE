home:

  hero:
    kicker: "Наталья Церетели · Тбилиси"
    # <em>…</em> выделяет слово курсивом и цветом. Можно убрать.
    title: "Грузинские инстанции — <em>моя</em> работа. Ваша — жить и работать"
    lead: >-
      ВНЖ, регистрация ИП, разрешение на трудовую деятельность, банковский счёт,
      налоги. Я беру на себя документы, переписку с ведомствами и сроки —
      вы получаете понятный план и результат.
    cta_primary: "Обсудить мою ситуацию"
    cta_secondary: "Посмотреть услуги"

  facts_label: "Коротко о работе"
  # Правая карточка в первом экране — сухие факты, снимающие первые вопросы.
  facts:
    - k: "Языки"
      v: "Русский · ქართული · English"
    - k: "Города"
      v: "Тбилиси, Батуми"
    - k: "Формат"
      v: "Онлайн и личные встречи"
    - k: "Цены"
      v: "Фиксированные, опубликованы"
    - k: "Ответ"
      v: "Обычно в течение рабочего дня"

  # Текст внутри декоративной печати в первом экране.
  stamp: "საქართველო · GEORGIA ·"

  trust:
    - title: "Цена известна заранее"
      body: >-
        Стоимость каждой услуги опубликована. Госпошлины, нотариус и переводчик
        оплачиваются отдельно и по факту — я всегда называю их до начала работы.
    - title: "Вами занимается один человек"
      body: >-
        Не колл-центр и не очередь из менеджеров. Вы с самого начала знаете,
        кто ведёт ваше дело и кому задать вопрос.
    - title: "Три языка в одной руке"
      body: >-
        С вами я говорю по-русски или по-английски, с ведомствами — по-грузински.
        Ничего не теряется в переводе.
    - title: "Сроки под контролем"
      body: >-
        Я слежу за датами окончания ВНЖ, разрешений и договоров
        и напоминаю о продлении заранее, а не в последнюю неделю.

  problem:
    kicker: "Зачем это нужно"
    title: "Сложность не в законах, а в том, что спросить о них негде"
    body:
      - >-
        Правила пребывания, регистрации бизнеса и найма в Грузии в целом
        доброжелательны к иностранцам. Но они разбросаны по разным ведомствам,
        меняются, а официальные разъяснения выходят на грузинском языке.
      - >-
        В результате человек тратит недели на форумы и чаты, собирает советы
        разной свежести, приезжает в Дом юстиции с неполным комплектом
        документов — и начинает заново.
      - >-
        Моя работа — заменить этот поиск одним понятным маршрутом: что именно
        нужно в вашем случае, в каком порядке, сколько это стоит по факту
        и что происходит с заявлением прямо сейчас.
    aside_title: "С чем ко мне приходят чаще всего"
    aside_items:
      - "Приехал(а) и не знаю, с чего начинать"
      - "Нужен ВНЖ, но непонятно, какое основание подходит"
      - "Отказали, и в отказе не написано, что именно исправить"
      - "Нужно легально работать или наняться в грузинскую компанию"
      - "Хочу открыть ИП и разобраться с налогом 1%"
      - "Банк отказал или тянет с открытием счёта"
      - "Заканчивается ВНЖ, а до продления две недели"

  services:
    kicker: "Услуги"
    title: "Шесть форматов — от одной задачи до полного ведения"
    lead: >-
      Можно взять одну процедуру и закрыть конкретный вопрос, а можно передать
      мне все административные дела на весь срок пребывания.
    prices_cta: "Полный прайс, включая отдельные услуги"

  process:
    kicker: "Как мы работаем"
    title: "Четыре шага, и дальше — только уведомления от меня"
    lead: >-
      Никаких «пришлите всё, что есть, и подождите». На каждом этапе вы знаете,
      что происходит и что нужно от вас.
    steps:
      - title: "Разбираем ситуацию"
        body: >-
          30–40 минут разговора: цель, гражданство, сроки, семья, работа
          и доходы. На выходе — понимание, какие основания вам реально доступны.
      - title: "План и смета"
        body: >-
          Письменный маршрут: перечень документов, порядок действий, сроки
          и полная стоимость, включая госпошлины и услуги третьих лиц.
      - title: "Готовим документы"
        body: >-
          Проверяю ваши документы, заполняю заявления, организую перевод
          и нотариальное заверение, записываю на приёмы.
      - title: "Ведём до результата"
        body: >-
          Общаюсь с ведомствами, отслеживаю рассмотрение, реагирую на запросы
          дополнительных документов и сообщаю о решении.

  about:
    kicker: "Кто я"
    title: "Наталья Церетели — ваш кейс-менеджер в Грузии"
    body:
      - >-
        Я живу в Грузии и занимаюсь административным сопровождением иностранных
        граждан: от первой регистрации ИП до продления ВНЖ и вопросов найма.
      - >-
        Я не юридическая фирма и не адвокат. Я — человек, который знает, как
        устроены грузинские процедуры на практике: какой документ примут, а какой
        вернут; где очередь, а где электронная запись; что спросят на собеседовании.
      - >-
        Такая работа держится на аккуратности. Поэтому по каждому делу у меня
        есть перечень документов, даты и статус — и вы можете спросить о них
        в любой момент.
    points_title: "Как я работаю"
    points:
      - "Говорю прямо: если задача решается без меня, я так и скажу"
      - "Не обещаю результатов, которые зависят не от меня"
      - "Все суммы называю до начала работы, а не по ходу"
      - "Документы и данные клиентов не покидают моих рук"
      - "Если нужен адвокат или аудитор — приведу проверенного"
    # Личная цитата под фотографией — голос владелицы, не маркетинг.
    quote: >-
      Я не обещаю, что грузинская бюрократия станет простой. Обещаю, что разбираться в ней в одиночку вам больше не придётся.
    signature_caption: "Наталья Церетели · Тбилиси"
    cta: "Подробнее обо мне"

  faq:
    kicker: "Вопросы"
    title: "Что спрашивают перед началом"
    all_cta: "Все вопросы и ответы →"
    items:
      - q: "Вы юрист?"
        a: >-
          Нет. Я персональный менеджер по административным вопросам:
          готовлю и подаю документы, общаюсь с ведомствами, контролирую сроки.
          Юридическое представительство в суде и правовые заключения — это работа
          адвоката, и если она понадобится, я порекомендую специалиста.
      - q: "Вы гарантируете, что ВНЖ одобрят?"
        a: >-
          Нет, и никто не может: решение принимает государственный орган.
          Я отвечаю за то, что зависит от подготовки — комплект будет полным,
          заявление корректным, сроки соблюдены, а запросы ведомства
          обработаны быстро. Это заметно повышает шансы, но не заменяет решение.
      - q: "Входят ли госпошлины и нотариус в стоимость?"
        a: >-
          Нет. Государственные пошлины, услуги нотариуса и переводчика
          оплачиваются отдельно и по фактической стоимости. Я называю эти суммы
          заранее, в смете, чтобы итоговая цифра не была неожиданностью.
      - q: "Нужно ли мне приезжать лично?"
        a: >-
          Часть процедур можно пройти дистанционно, но не все: например,
          документы в Агентство по вопросам занятости заявитель подаёт сам,
          и обязательное видео-собеседование проходит лично. Я готовлю вас
          к этим шагам и сопровождаю всё остальное.
      - q: "На каком языке мы будем общаться?"
        a: >-
          С вами — по-русски или по-английски, как удобнее. С ведомствами,
          нотариусом и банком — по-грузински. Отдельного переводчика для общения
          со мной не нужно.
      - q: "Можно взять только одну процедуру, без пакета?"
        a: >-
          Да. В прайсе есть отдельные услуги: проверка документов, заполнение
          заявления, сопровождение в госучреждение, помощь с банковским счётом.
          Пакет выгоднее, когда задач несколько.

# --- Финальный блок «поговорим» (одинаковый на всех страницах) --------------
