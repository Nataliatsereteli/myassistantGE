    service_type: "Абонентское административное сопровождение"
    tagline: >-
      Вы не заказываете услуги по одной — вы просто передаёте
      административную часть жизни в Грузии мне.
    summary: >-
      Ежемесячное сопровождение: взаимодействие с государственными органами,
      подготовка документов, заполнение заявлений, организация встреч
      и визитов, вопросы банка, координация налогов, контроль сроков действия
      документов, поиск переводчика или юриста при необходимости.
    seo_title: "Персональный менеджер в Грузии — сопровождение по подписке"
    seo_description: >-
      Ежемесячное административное сопровождение в Грузии: госорганы,
      документы, заявления, банк, налоги, контроль сроков действия ВНЖ
      и разрешений.
    duration: "Ежемесячно, без ограничения количества обращений по договору"
    format: "Постоянный контакт в мессенджере + встречи"
    for_whom:
      - >-
        У вас регулярно возникают административные вопросы: продления,
        справки, налоговые сроки, документы для семьи, визиты в ведомства.
      - >-
        Вы предпочитаете один канал и одного ответственного человека
        вместо поиска исполнителя под каждую задачу.
    includes:
      - "Взаимодействие с государственными органами"
      - "Подготовка документов"
      - "Заполнение заявлений"
      - "Организация встреч и визитов"
      - "Организация вопросов, связанных с банком"
      - "Координация налоговых вопросов"
      - "Контроль сроков действия вида на жительство и других документов"
      - "При необходимости — поиск переводчика или юриста"
      - "Получение информации от государственных органов от имени клиента в случаях, предусмотренных законодательством"
    excludes: >-
      Государственные пошлины и услуги третьих лиц оплачиваются отдельно.
      Ведение бухгалтерии не входит.
    result: >-
      Ни одного пропущенного срока и один человек, которому можно
      написать по любому административному вопросу.
    note: >-
      При заключении договора на 3 месяца стоимость ниже —
      точные суммы указаны в прайсе.
    faq:
      - q: "Есть ли лимит обращений?"
        a: >-
          Объём и границы фиксируются в договоре, чтобы обе стороны понимали
          ожидания. Обычные текущие вопросы входят; отдельные крупные процедуры
          (например, полное сопровождение нового ВНЖ) считаются отдельно.
      - q: "Можно оформить на семью?"
        a: >-
          Да. Координация административных вопросов членов семьи входит
          в пакет — обсудим состав на старте.
      - q: "Можно остановить и потом вернуться?"
        a: >-
          Да, это месячный формат. Условия приостановки фиксируем в договоре.

