  business:
    slug: "biznes-i-vnzh"
    name: "Бизнес / ВНЖ"
    short: "ИП, налоги, банковский счёт, право на работу и ВНЖ — одним процессом"
    service_type: "Комплексное сопровождение бизнеса и вида на жительство"
    tagline: >-
      Полный административный старт: от регистрации ИП
      до поданного заявления на вид на жительство.
    summary: >-
      Регистрация ИП, первичная консультация по налогам, регистрация
      на портале Службы доходов и настройка личного кабинета, помощь
      с открытием банковского счёта, сопровождение получения права
      на трудовую деятельность и подготовка заявления на ВНЖ.
    seo_title: "Бизнес и ВНЖ в Грузии: ИП, налоги, банк, вид на жительство"
    seo_description: >-
      Комплексное сопровождение в Грузии: регистрация ИП, налоги, портал
      Службы доходов, банковский счёт, право на трудовую деятельность и ВНЖ.
    duration: "2–5 недель в зависимости от банка и ведомств"
    format: "Онлайн + личные визиты по необходимости"
    for_whom:
      - >-
        Вы переезжаете, чтобы работать или вести дело из Грузии, и вам нужен
        весь административный контур сразу: статус, налоги, счёт и легальное
        пребывание.
      - >-
        Вы не хотите делать это по частям и потом обнаружить, что один шаг
        сделан так, что мешает следующему.
    includes:
      - "Регистрация в качестве индивидуального предпринимателя (ИП)"
      - "Первичная консультация по налоговым вопросам"
      - "Регистрация на официальном сайте Службы доходов Министерства финансов и настройка личного кабинета"
      - "Помощь в процессе открытия банковского счёта"
      - "Сопровождение процесса получения права на трудовую деятельность и подачи необходимых заявлений"
      - "Подготовка заявления на получение вида на жительство"
      - "Взаимодействие с государственными органами"
      - "Полный контроль всего процесса"
    excludes: >-
      Государственные пошлины, услуги нотариуса и переводчика, банковские
      сборы оплачиваются отдельно по фактической стоимости.
    steps:
      - "Разбираем модель: чем занимаетесь, откуда доход, кто клиенты"
      - "Регистрация ИП и налоговый режим"
      - "Личный кабинет Службы доходов, банк"
      - "Право на работу и заявление на ВНЖ"
    result: >-
      Зарегистрированный статус, рабочий личный кабинет в налоговой,
      открытый счёт и поданное заявление на ВНЖ.
    faq:
      - q: "Гарантируете ли вы открытие банковского счёта?"
        a: >-
          Нет — решение принимает банк, и у каждого свои требования
          к иностранным клиентам. Я готовлю комплект так, чтобы вопросов было
          меньше, сопровождаю процесс и, если один банк отказал,
          предлагаю следующий.
      - q: "Чем это отличается от пакета «Старт в Грузии»?"
        a: >-
          «Старт» — это только регистрация ИП. Здесь к ней добавляются налоги,
          личный кабинет, банк, право на работу и заявление на ВНЖ,
          то есть весь административный контур.
      - q: "А если у меня уже есть ИП?"
        a: >-
          Тогда часть работы не нужна, и мы соберём услугу из отдельных
          позиций прайса — так дешевле. Напишите, что уже сделано.

