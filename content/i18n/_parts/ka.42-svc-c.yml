  vip:
    slug: "vip-mkhardachera"
    name: "VIP-მხარდაჭერა"
    short: "პრიორიტეტული კავშირი, პირადი ვიზიტები და მთელი გარემოს კოორდინაცია"
    service_type: "პრიორიტეტული პერსონალური თანხლება"
    tagline: >-
      მაქსიმალური ჩართულობა: პრიორიტეტული პასუხი, პირადი ყოფნა
      და საცხოვრებლის, ბანკის, სერვისებისა და ოჯახის დოკუმენტების კოორდინაცია.
    summary: >-
      ყველაფერი, რაც დანარჩენ პაკეტებში შედის, პლუს პრიორიტეტული კომუნიკაცია,
      უფრო ხშირი პირადი შეხვედრები, თანხლება სახელმწიფო დაწესებულებებში,
      საცხოვრებლის, ბანკისა და სერვისების საკითხების კოორდინაცია, თარჯიმნის
      მომსახურების ორგანიზება და ოჯახის წევრების ადმინისტრაციული საკითხები.
    seo_title: "VIP-მხარდაჭერა საქართველოში — პერსონალური მენეჯერი"
    seo_description: >-
      პრიორიტეტული თანხლება საქართველოში: პირადი ვიზიტები უწყებებში,
      საცხოვრებლის, ბანკისა და სერვისების კოორდინაცია, თარჯიმანი, ოჯახის
      საკითხები.
    duration: "ყოველთვიურად"
    format: "პრიორიტეტული კავშირი + რეგულარული პირადი შეხვედრები"
    for_whom:
      - >-
        თქვენთვის მთავარია არა თავად გარკვევა, არამედ შედეგი: დრო ძვირია,
        ამოცანები ბევრია და საკითხები მთელ ოჯახს ეხება.
      - >-
        გსურთ, რომ ვინმე ფიზიკურად წამოვიდეს თქვენთან ერთად უწყებაში,
        ესაუბროს ბანკს და მთელი კალენდარი ხელში ეჭიროს.
    includes:
      - "წინა პაკეტების ყველა მომსახურება"
      - "პრიორიტეტული კომუნიკაცია"
      - "უფრო ხშირი პირადი შეხვედრები"
      - "თანხლება სხვადასხვა სახელმწიფო დაწესებულებაში"
      - "დოკუმენტების სრული ადმინისტრაციული თანხლება"
      - "საცხოვრებელთან, ბანკთან და სხვადასხვა სერვისთან დაკავშირებული საკითხების კოორდინაცია"
      - "თარჯიმნის მომსახურების ორგანიზება"
      - "ოჯახის წევრების ადმინისტრაციული საკითხების კოორდინაცია"
    excludes: >-
      სახელმწიფო ბაჟი, ნოტარიუსისა და თარჯიმნის მომსახურება, ქირა
      და საბანკო საკომისიოები ცალკე იხდება.
    result: >-
      საქართველოში ცხოვრების ადმინისტრაციული მხარე, რომელსაც თითქმის
      აღარ ეხებით პირადად.
    faq:
      - q: "რას ნიშნავს „პრიორიტეტული კომუნიკაცია“?"
        a: >-
          თქვენი შეტყობინებები პირველ რიგში მუშავდება, გადაუდებელ საკითხებზე კი
          კავშირის უფრო ფართო ინტერვალი მოქმედებს. კონკრეტულ პირობებს
          ხელშეკრულებაში ვაფიქსირებთ.
      - q: "რატომ არის ფასი „დან“?"
        a: >-
          მოცულობა ძალიან არის დამოკიდებული ოჯახის შემადგენლობაზე, ქალაქსა
          და ამოცანების რაოდენობაზე. საბოლოო თანხას სიტუაციის გარჩევის
          შემდეგ გეუბნებით — სამუშაოს დაწყებამდე.

