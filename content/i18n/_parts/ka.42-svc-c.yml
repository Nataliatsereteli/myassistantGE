        უცხო ქვეყნის მოქალაქე ხართ და გჭირდებათ საქართველოში ლეგალურად
        მუშაობა ან ქართულ კომპანიაში დასაქმება.
      - >-
        გსურთ პროცედურა მთლიანად გაიგოთ ან მისი წარმოება გადააბაროთ და
        მხოლოდ პირადი ნაბიჯები დაიტოვოთ.
    includes:
      - "პირველადი კონსულტაცია და სიტუაციის შეფასება"
      - "საჭირო დოკუმენტებისა და ინფორმაციის განსაზღვრა"
      - "წარმოდგენილი დოკუმენტების შემოწმება"
      - "განცხადების შევსებაში დახმარება"
      - "ელექტრონულ სისტემაში რეგისტრაციასა და მუშაობაში დახმარება"
      - "სახელმწიფო მომსახურების გადახდის პროცესის ორგანიზება და კონტროლი"
      - "სავალდებულო ონლაინ გასაუბრებისთვის მომზადება და მისი გავლის წესის განმარტება"
      - "საჭიროების შემთხვევაში — თარჯიმნის მომსახურების ორგანიზება"
      - "განცხადების განხილვის კონტროლი"
      - "თანხლების ფარგლებში შესაბამის სახელმწიფო უწყებებთან ურთიერთობა"
      - "დამატებითი დოკუმენტების ან ინფორმაციის მოთხოვნის შემთხვევაში დახმარება"
      - "მიღებული გადაწყვეტილების შესახებ ინფორმირება"
      - "შრომითი საქმიანობის უფლების მოქმედების ვადის კონტროლი"
      - "გაგრძელებისთვის დოკუმენტების მომზადებაში დახმარება"
    excludes: >-
      მომსახურების სახელმწიფო ბაჟი და თარჯიმნის მომსახურება
      ცალკე იხდება.
    note: >-
      მნიშვნელოვანია იცოდეთ: დოკუმენტებს სააგენტოში უშუალოდ განმცხადებელი
      წარადგენს და სავალდებულო ვიდეო გასაუბრებასაც პირადად გადის.
      მომსახურება მოიცავს დოკუმენტების მომზადებისა და წარდგენის სრულ
      ადმინისტრაციულ თანხლებას და პროცედურის ყველა ეტაპის კოორდინაციას.
    steps:
      - "სიტუაციის შეფასება და დოკუმენტების ჩამონათვალი"
      - "პაკეტის შემოწმება და განცხადების შევსება"
      - "ელექტრონული განაცხადი და სახელმწიფო მომსახურების გადახდა"
      - "ვიდეო გასაუბრებისთვის მომზადება"
      - "განხილვის კონტროლი და გადაწყვეტილების შესახებ ინფორმირება"
    result: >-
      სწორად წარდგენილი განცხადება, მომზადებული გასაუბრება
      და მოპოვებული უფლების მოქმედების ვადის კონტროლი.
    faq:
      - q: "რით განსხვავდება კონსულტაცია თანხლებისგან?"
        a: >-
          კონსულტაცია არის თქვენი სიტუაციის შეფასება, დოკუმენტების ჩამონათვალი,
          პროცედურისა და ვადების განმარტება და განცხადების შევსების ინსტრუქცია:
          შემდეგ თავად მოქმედებთ. თანხლება არის მაშინ, როცა პროცესს მე ვუძღვები:
          ვამოწმებ დოკუმენტებს, გეხმარებით განცხადებასა და ელექტრონულ განაცხადში,
          ვაკოორდინირებ გადახდას, გამზადებთ გასაუბრებისთვის და თვალს ვადევნებ განხილვას.
      - q: "შეიძლება თუ არა გასაუბრება ჩემ ნაცვლად გაიაროთ?"
        a: >-
          არა. სავალდებულო ვიდეო გასაუბრებას განმცხადებელი პირადად გადის,
          ეს პროცედურის მოთხოვნაა. მე გამზადებთ მისთვის: აგიხსნით წესს,
          ტიპურ კითხვებს და საჭიროების შემთხვევაში თარჯიმანს მოვაწყობ.
      - q: "საჭიროა თუ არა ბინადრობის ნებართვა შრომის უფლებისთვის?"
        a: >-
          ეს სხვადასხვა პროცედურაა, მაგრამ ხშირად ერთად მიდის და თანმიმდევრობას
          მნიშვნელობა აქვს. კონსულტაციაზე გეტყვით, თქვენს შემთხვევაში რომელი
          უფრო ლოგიკურია პირველი გააკეთოთ.

