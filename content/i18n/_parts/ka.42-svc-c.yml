      ადმინისტრაციული თანხლება: დოკუმენტების განსაზღვრა, პაკეტის შემოწმება,
      დახმარება ელექტრონულ სისტემასა და გადახდაში, სავალდებულო ონლაინ
      გასაუბრებისთვის მომზადება, განხილვის კონტროლი.
