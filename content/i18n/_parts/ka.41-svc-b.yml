  manager:
    slug: "personaluri-menejeri"
    name: "პერსონალური მენეჯერი"
    short: "ყველა ადმინისტრაციული საკითხის ყოველთვიური წარმოება ყოფნის მთელ პერიოდში"
    service_type: "სააბონენტო ადმინისტრაციული თანხლება"
    tagline: >-
      თქვენ სათითაოდ არ უკვეთავთ მომსახურებას — უბრალოდ საქართველოში
      ცხოვრების ადმინისტრაციულ ნაწილს მე მაბარებთ.
    summary: >-
      ყოველთვიური თანხლება: ურთიერთობა სახელმწიფო უწყებებთან, დოკუმენტების
      მომზადება, განაცხადების შევსება, შეხვედრებისა და ვიზიტების ორგანიზება,
      საბანკო საკითხები, გადასახადების კოორდინაცია, დოკუმენტების ვადების
      კონტროლი, საჭიროებისას თარჯიმნის ან იურისტის მოძიება.
    seo_title: "პერსონალური მენეჯერი საქართველოში — თანხლება გამოწერით"
    seo_description: >-
      ყოველთვიური ადმინისტრაციული თანხლება საქართველოში: უწყებები,
      დოკუმენტები, ბანკი, გადასახადები, ვადების კონტროლი. ფასდაკლება 3-თვიან
      ხელშეკრულებაზე.
    duration: "ყოველთვიურად, ხელშეკრულებით მიმართვების რაოდენობის შეზღუდვის გარეშე"
    format: "მუდმივი კონტაქტი მესენჯერში + შეხვედრები"
    for_whom:
      - >-
        ადმინისტრაციული საკითხები რეგულარულად გიჩნდებათ: გაგრძელებები,
        ცნობები, საგადასახადო ვადები, დოკუმენტები ოჯახისთვის, ვიზიტები უწყებებში.
      - >-
        გირჩევნიათ ერთი არხი და ერთი პასუხისმგებელი ადამიანი, ვიდრე ყოველი
        ამოცანისთვის ცალკე შემსრულებლის ძებნა.
    includes:
      - "ურთიერთობა სახელმწიფო უწყებებთან"
      - "დოკუმენტების მომზადება"
      - "განაცხადების შევსება"
      - "შეხვედრებისა და ვიზიტების ორგანიზება"
      - "ბანკთან დაკავშირებული საკითხების მოგვარება"
      - "საგადასახადო საკითხების კოორდინაცია"
      - "ბინადრობის ნებართვისა და სხვა დოკუმენტების მოქმედების ვადების კონტროლი"
      - "საჭიროების შემთხვევაში — თარჯიმნის ან იურისტის მოძიება"
      - "კანონმდებლობით გათვალისწინებულ შემთხვევებში კლიენტის სახელით სახელმწიფო უწყებებიდან ინფორმაციის მიღება"
    excludes: >-
      სახელმწიფო ბაჟები და მესამე პირების მომსახურება ცალკე ანაზღაურდება.
      ბუღალტრული აღრიცხვის წარმოება არ შედის.
    result: >-
      არცერთი გაშვებული ვადა და ერთი ადამიანი, რომელსაც ნებისმიერ
      ადმინისტრაციულ საკითხზე შეგიძლიათ მისწეროთ.
    note: >-
      3-თვიანი ხელშეკრულების გაფორმებისას ღირებულება უფრო დაბალია —
      ზუსტი თანხები პრაისშია მითითებული.
    faq:
      - q: "არსებობს თუ არა მიმართვების ლიმიტი?"
        a: >-
          მოცულობა და საზღვრები ხელშეკრულებაში ფიქსირდება, რომ ორივე მხარეს
          ერთნაირი მოლოდინი ჰქონდეს. ჩვეულებრივი მიმდინარე საკითხები შედის;
          ცალკეული მსხვილი პროცედურები (მაგალითად, ახალი ბინადრობის ნებართვის
          სრული თანხლება) ცალკე ითვლება.
      - q: "შესაძლებელია ოჯახზე გაფორმება?"
        a: >-
          დიახ. ოჯახის წევრების ადმინისტრაციული საკითხების კოორდინაცია
          პაკეტში შედის — შემადგენლობას სტარტზე შევათანხმებთ.
      - q: "შესაძლებელია შეჩერება და შემდეგ დაბრუნება?"
        a: >-
          დიახ, ეს თვიური ფორმატია. შეჩერების პირობებს ხელშეკრულებაში ვაფიქსირებთ.

