  business:
    slug: "biznesi-da-binadroba"
    name: "ბიზნესი / ბინადრობის ნებართვა"
    short: "ინდმეწარმე, გადასახადები, საბანკო ანგარიში, შრომითი უფლება და ბინადრობა — ერთ პროცესად"
    service_type: "ბიზნესისა და ბინადრობის ნებართვის კომპლექსური თანხლება"
    tagline: >-
      სრული ადმინისტრაციული სტარტი: ინდმეწარმის რეგისტრაციიდან
      ბინადრობის ნებართვაზე შეტანილ განაცხადამდე.
    summary: >-
      ინდმეწარმის რეგისტრაცია, პირველადი საგადასახადო კონსულტაცია,
      შემოსავლების სამსახურის პორტალზე რეგისტრაცია და პირადი კაბინეტის
      გამართვა, დახმარება საბანკო ანგარიშის გახსნაში, შრომითი საქმიანობის
      უფლების მიღების თანხლება და ბინადრობის განაცხადის მომზადება.
    seo_title: "ინდმეწარმე, ბანკი და ბინადრობა საქართველოში — თანხლება"
    seo_description: >-
      ინდმეწარმის რეგისტრაცია, შემოსავლების სამსახურის კაბინეტი, საბანკო
      ანგარიში, შრომითი საქმიანობის უფლება და ბინადრობის განაცხადი — ერთ
      პროცესად.
    duration: "2–5 კვირა, ბანკისა და უწყებების მიხედვით"
    format: "ონლაინ + პირადი ვიზიტები საჭიროებისამებრ"
    for_whom:
      - >-
        გადმოდიხართ იმისთვის, რომ იმუშაოთ ან საქმე აწარმოოთ საქართველოდან,
        და მთელი ადმინისტრაციული კონტური ერთდროულად გჭირდებათ: სტატუსი,
        გადასახადები, ანგარიში და ლეგალური ყოფნა.
      - >-
        არ გინდათ ეს ნაწილ-ნაწილ გააკეთოთ და მერე აღმოაჩინოთ, რომ ერთი ნაბიჯი
        ისე დაიდგა, რომ შემდეგს უშლის ხელს.
    includes:
      - "ინდივიდუალურ მეწარმედ რეგისტრაცია (ინდმეწარმე)"
      - "პირველადი კონსულტაცია საგადასახადო საკითხებზე"
      - "ფინანსთა სამინისტროს შემოსავლების სამსახურის ოფიციალურ საიტზე რეგისტრაცია და პირადი კაბინეტის გამართვა"
      - "დახმარება საბანკო ანგარიშის გახსნის პროცესში"
      - "შრომითი საქმიანობის უფლების მიღებისა და საჭირო განაცხადების შეტანის თანხლება"
      - "ბინადრობის ნებართვის მისაღები განაცხადის მომზადება"
      - "ურთიერთობა სახელმწიფო უწყებებთან"
      - "მთელი პროცესის სრული კონტროლი"
    excludes: >-
      სახელმწიფო ბაჟები, ნოტარიუსისა და თარჯიმნის მომსახურება და საბანკო
      მოსაკრებლები ცალკე, ფაქტობრივი ღირებულებით ანაზღაურდება.
    steps:
      - "ვარკვევთ მოდელს: რას საქმიანობთ, საიდან შემოდის შემოსავალი, ვინ არიან კლიენტები"
      - "ინდმეწარმის რეგისტრაცია და საგადასახადო რეჟიმი"
      - "შემოსავლების სამსახურის პირადი კაბინეტი, ბანკი"
      - "შრომითი საქმიანობის უფლება და განაცხადი ბინადრობაზე"
    result: >-
      რეგისტრირებული სტატუსი, მოქმედი პირადი კაბინეტი შემოსავლების სამსახურში,
      გახსნილი ანგარიში და შეტანილი განაცხადი ბინადრობის ნებართვაზე.
    faq:
      - q: "იძლევით თუ არა საბანკო ანგარიშის გახსნის გარანტიას?"
        a: >-
          არა — გადაწყვეტილებას ბანკი იღებს და თითოეულს უცხოელი კლიენტების
          მიმართ თავისი მოთხოვნები აქვს. პაკეტს ისე ვამზადებ, რომ კითხვები
          ნაკლები დარჩეს, თან ვახლავარ პროცესს და თუ ერთმა ბანკმა უარი თქვა,
          შემდეგს გთავაზობთ.
      - q: "რით განსხვავდება ეს პაკეტისგან «სტარტი საქართველოში»?"
        a: >-
          «სტარტი» მხოლოდ ინდმეწარმის რეგისტრაციაა. აქ მას ემატება გადასახადები,
          პირადი კაბინეტი, ბანკი, შრომითი საქმიანობის უფლება და განაცხადი
          ბინადრობაზე, ანუ მთელი ადმინისტრაციული კონტური.
      - q: "და თუ ინდმეწარმე უკვე მაქვს?"
        a: >-
          მაშინ სამუშაოს ნაწილი აღარ დაგჭირდებათ და მომსახურებას პრაისის
          ცალკეული პოზიციებისგან ავაწყობთ — ასე უფრო იაფია. მომწერეთ, რა არის
          უკვე გაკეთებული.

