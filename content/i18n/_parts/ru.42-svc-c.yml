  work_permit:
    slug: "razreshenie-na-rabotu"
    name: "Право на трудовую деятельность"
    short: "Консультация или полное сопровождение процедуры для иностранца"
    service_type: "Сопровождение получения права на трудовую деятельность"
    tagline: >-
      Процедуру проходит заявитель лично — я делаю так, чтобы он пришёл
      на неё подготовленным и с правильным комплектом.
    summary: >-
      Административное сопровождение процесса получения права на трудовую
      деятельность для иностранных граждан: определение документов, проверка
      комплекта, помощь с электронной системой и оплатой, подготовка
      к обязательному онлайн-собеседованию, контроль рассмотрения.
    seo_title: "Разрешение на работу в Грузии — сопровождение иностранцев"
    seo_description: >-
      Право на трудовую деятельность в Грузии: консультация от 100 ₾,
      полное сопровождение от 300 ₾. Документы, заявка, оплата,
      видео-собеседование.
    duration: "Зависит от срока рассмотрения ведомства"
    format: "Онлайн; собеседование заявитель проходит лично"
    for_whom:
      - >-
        Вы иностранный гражданин и вам нужно легально работать в Грузии
        или устроиться в грузинскую компанию.
      - >-
        Вам нужно понять процедуру целиком либо передать её ведение,
        оставив себе только личные шаги.
    includes:
      - "Первичная консультация и оценка ситуации"
      - "Определение необходимых документов и информации"
      - "Проверка предоставленных документов"
      - "Помощь в заполнении заявления"
      - "Помощь в регистрации и работе с электронной системой"
      - "Организация и контроль процесса оплаты государственной услуги"
      - "Подготовка к обязательному онлайн-собеседованию и разъяснение порядка его прохождения"
      - "При необходимости — организация услуг переводчика"
      - "Контроль рассмотрения заявления"
      - "Взаимодействие с соответствующими государственными органами в рамках сопровождения"
      - "Помощь в случае запроса дополнительных документов или информации"
      - "Информирование о принятом решении"
      - "Контроль срока действия права на трудовую деятельность"
      - "Помощь в подготовке документов для продления"
    excludes: >-
      Государственная пошлина за услугу и услуги переводчика
      оплачиваются отдельно.
    note: >-
      Важно знать: документы в Агентство предоставляет непосредственно
      заявитель, и обязательное видео-собеседование он также проходит лично.
      Услуга включает полное административное сопровождение подготовки
      и подачи документов и координацию всех этапов процедуры.
    steps:
      - "Оценка ситуации и перечень документов"
      - "Проверка комплекта и заполнение заявления"
      - "Электронная заявка и оплата государственной услуги"
      - "Подготовка к видео-собеседованию"
      - "Контроль рассмотрения и информирование о решении"
    result: >-
      Корректно поданное заявление, подготовленное собеседование
      и контроль срока действия полученного права.
    faq:
      - q: "Чем отличается консультация от сопровождения?"
        a: >-
          Консультация — это оценка вашей ситуации, перечень документов,
          разъяснение процедуры и сроков и инструкция по заполнению заявления:
          дальше вы действуете сами. Сопровождение — это когда я веду процесс:
          проверяю документы, помогаю с заявлением и электронной заявкой,
          координирую оплату, готовлю к собеседованию и отслеживаю рассмотрение.
      - q: "Можно ли пройти собеседование вместо меня?"
        a: >-
          Нет. Обязательное видео-собеседование заявитель проходит лично,
          это требование процедуры. Я готовлю вас к нему: объясняю порядок,
          типичные вопросы и при необходимости организую переводчика.
      - q: "Нужен ли ВНЖ для права на работу?"
        a: >-
          Это разные процедуры, но они часто идут вместе, и порядок имеет
          значение. На консультации я скажу, что в вашем случае логичнее
          делать первым.

