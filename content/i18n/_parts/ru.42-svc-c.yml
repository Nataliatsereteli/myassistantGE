  vip:
    slug: "vip-soprovozhdenie"
    name: "VIP-сопровождение"
    short: "Приоритетная связь, личные визиты и координация всего окружения"
    service_type: "Приоритетное персональное сопровождение"
    tagline: >-
      Максимальная включённость: приоритетный ответ, личное присутствие
      и координация жилья, банка, сервисов и документов семьи.
    summary: >-
      Всё, что входит в остальные пакеты, плюс приоритетная коммуникация,
      более частые личные встречи, сопровождение в государственные учреждения,
      координация вопросов жилья, банка и сервисов, организация услуг
      переводчика и административные вопросы членов семьи.
    seo_title: "VIP-сопровождение в Грузии — персональный менеджер под ключ"
    seo_description: >-
      Приоритетное персональное сопровождение в Грузии: личные визиты
      в госучреждения, координация жилья, банка и сервисов, переводчик,
      вопросы семьи.
    duration: "Ежемесячно"
    format: "Приоритетная связь + регулярные личные встречи"
    for_whom:
      - >-
        Вам важно не разбираться, а получать результат: время дороже,
        задач много, вопросы касаются всей семьи.
      - >-
        Вы хотите, чтобы кто-то физически поехал с вами в ведомство,
        поговорил с банком и держал в руках весь календарь.
    includes:
      - "Все услуги предыдущих пакетов"
      - "Приоритетная коммуникация"
      - "Более частые личные встречи"
      - "Сопровождение в различные государственные учреждения"
      - "Полное административное сопровождение документов"
      - "Координация вопросов, связанных с жильём, банком и различными сервисами"
      - "Организация услуг переводчика"
      - "Координация административных вопросов членов семьи"
    excludes: >-
      Государственные пошлины, услуги нотариуса, переводчика, аренда
      и банковские сборы оплачиваются отдельно.
    result: >-
      Административная сторона жизни в Грузии, которой вы почти
      не занимаетесь лично.
    faq:
      - q: "Что значит «приоритетная коммуникация»?"
        a: >-
          Ваши сообщения обрабатываются первыми, а по срочным вопросам
          доступен более широкий интервал связи. Конкретные условия
          фиксируем в договоре.
      - q: "Почему цена «от»?"
        a: >-
          Объём сильно зависит от состава семьи, города и количества задач.
          Итоговую сумму называю после разбора ситуации — до начала работы.

