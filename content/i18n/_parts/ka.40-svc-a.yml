  # --------------------------------------------------------------- 01 -------
  start:
    slug: "start-sakartveloshi"
    name: "სტარტი საქართველოში"
    short: "პირველი ადმინისტრაციული ნაბიჯები: ინდმეწარმის რეგისტრაცია და გასაგები სამოქმედო გეგმა"
    service_type: "ინდივიდუალური მეწარმის რეგისტრაცია"
    tagline: >-
      მათთვის, ვინც უკვე საქართველოშია და სურს პირველი რიგის
      ადმინისტრაციული საკითხების დახურვა, ნულიდან გარკვევის გარეშე.
    summary: >-
      ინდივიდუალურ მეწარმედ რეგისტრაციის ორგანიზება, საჭირო დოკუმენტების
      ჩამონათვალი, განცხადებების მომზადება, სახელმწიფო უწყებებთან
      კომუნიკაცია და რეგისტრაციის პროცესის კონტროლი.
    seo_title: "ინდმეწარმის რეგისტრაცია საქართველოში — თანხლება"
    seo_description: >-
      ინდმეწარმის რეგისტრაცია საქართველოში: დოკუმენტების ჩამონათვალი,
      განცხადების მომზადება, კომუნიკაცია უწყებებთან და კონტროლი
      ამონაწერამდე.
    duration: "ჩვეულებრივ 1–3 სამუშაო დღე დოკუმენტების შეგროვების შემდეგ"
    format: "ონლაინ + საჭიროების შემთხვევაში ერთი ვიზიტი"
    for_whom:
      - >-
        ჩამოხვედით საქართველოში და სწრაფად გჭირდებათ ლეგალური ფორმა
        საქმიანობისა და შემოსავლისთვის — ყველაზე ხშირად ეს ინდივიდუალური
        მეწარმის სტატუსია.
      - >-
        არ გინდათ რეგლამენტების შესწავლა, იუსტიციის სახლში დაუზუსტებლად
        სიარული და ადგილზე გარკვევა, რომელი დოკუმენტი აკლია.
    includes:
      - "ინდივიდუალურ მეწარმედ (ინდმეწარმე) რეგისტრაციის ორგანიზება"
      - "თქვენს სიტუაციაზე მორგებული საჭირო დოკუმენტების ჩამონათვალის მიწოდება"
      - "განცხადებების მომზადებაში დახმარება"
      - "შესაბამის სახელმწიფო უწყებებთან კომუნიკაცია"
      - "რეგისტრაციის პროცესის კონტროლი ამონაწერის მიღებამდე"
    excludes: >-
      სახელმწიფო ბაჟი, ნოტარიუსისა და თარჯიმნის მომსახურება ცალკე,
      ფაქტობრივი ღირებულებით ანაზღაურდება.
    steps:
      - "მოკლე საუბარი: რა საქმიანობას გეგმავთ და რა შემოსავალს ელოდებით"
      - "დოკუმენტების სია და რომელი მათგანის თარგმნაა საჭირო"
      - "განცხადების მომზადება და წარდგენა"
      - "ამონაწერის მიღება და ახსნა, რა უნდა გააკეთოთ შემდეგ"
    result: >-
      რეგისტრირებული ინდმეწარმის სტატუსი, ამონაწერი რეესტრიდან
      და გასაგები შემდეგი ნაბიჯი — გადასახადები, ბანკი ან ბინადრობა.
    faq:
      - q: "საჭიროა თუ არა ბინადრობის ნებართვა საქართველოში ინდმეწარმის გასახსნელად?"
        a: >-
          როგორც წესი, არა: ინდივიდუალური მეწარმის რეგისტრაცია და ბინადრობის
          ნებართვა სხვადასხვა პროცედურაა. თუმცა დოკუმენტების ნაკრები თქვენს
          ყოფნის სტატუსზეა დამოკიდებული, ამიტომ მას ინდივიდუალურად ვადგენ.
      - q: "მაშინვე მექნება 1%-იანი გადასახადი?"
        a: >-
          მცირე ბიზნესის სტატუსი ცალკე ენიჭება და არა საქმიანობის ყველა
          სახეს. კონსულტაციაზე გიხსნით, გამოგადგებათ თუ არა და რა უნდა
          გაკეთდეს ამისთვის რეგისტრაციისას.
      - q: "შესაძლებელია თუ არა ერთდროულად ინდმეწარმეც და ბინადრობაც?"
        a: >-
          დიახ, ამისთვის არის პაკეტი „ბიზნესი / ბინადრობა“ — იქ რეგისტრაცია,
          გადასახადები, ბანკი და ბინადრობის განცხადება ერთ პროცესად მიდის.

