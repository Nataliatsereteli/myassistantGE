  privacy:
    slug: "politika-konfidencialnosti"
    title: "Политика конфиденциальности"
    nav_title: "Конфиденциальность"
    seo_title: "Политика конфиденциальности"
    seo_description: >-
      Какие данные собирает сайт, зачем они нужны, сколько хранятся и кому
      передаются. Обработка персональных данных при сопровождении в Грузии.
    updated: "2026"
    body:
      - h: "Кто обрабатывает данные"
        p:
          - >-
            Сайт принадлежит индивидуальному предпринимателю,
            оказывающему услуги административного сопровождения в Грузии.
            Контактные данные указаны на странице «Контакты».
      - h: "Какие данные собираются"
        p:
          - >-
            Сайт статический и сам по себе не создаёт учётных записей
            и не хранит базу посетителей. Данные появляются только тогда,
            когда вы сами их отправляете.
        list:
          - "Имя и способ связи, если вы заполнили форму заявки"
          - "Текст вашего сообщения"
          - "Язык страницы и адрес страницы, с которой отправлена заявка"
          - "Обезличенная статистика посещений, если аналитика включена"
      - h: "Зачем"
        p:
          - >-
            Единственная цель — ответить вам и оказать услугу, о которой
            вы спрашиваете. Данные не используются для рекламы и не продаются.
      - h: "Кому передаются"
        list:
          - "Сервису отправки формы — только чтобы доставить письмо"
          - "Государственным органам, нотариусу, переводчику или банку — только в объёме, необходимом для вашей процедуры, и только с вашего согласия"
          - "Никому больше"
      - h: "Сколько хранятся"
        p:
          - >-
            Переписка и документы хранятся столько, сколько нужно
            для оказания услуги и выполнения требований законодательства,
            после чего удаляются.
      - h: "Ваши права"
        p:
          - >-
            Вы можете попросить показать, исправить или удалить свои данные —
            напишите на контактный адрес, и я это сделаю.
      - h: "Cookies"
        p:
          - >-
            Сайт не использует рекламные cookies. Выбранный язык
            сохраняется в локальном хранилище браузера, чтобы не спрашивать
            его каждый раз; это не передаётся никому.

  terms:
    slug: "usloviya"
    title: "Условия оказания услуг"
    nav_title: "Условия"
    seo_title: "Условия оказания услуг"
    seo_description: >-
      Что входит в услуги административного сопровождения в Грузии и что
      не входит, как формируется стоимость и где границы моей ответственности.
    updated: "2026"
    body:
      - h: "Характер услуг"
        p:
          - >-
            Оказываются услуги административного сопровождения:
            консультирование по процедуре, подготовка и проверка документов,
            заполнение заявлений, взаимодействие с государственными органами
            в рамках сопровождения, контроль сроков.
          - >-
            Услуги не являются юридической помощью в смысле представительства
            в суде и не включают правовые заключения. При необходимости
            рекомендуется обращение к адвокату.
      - h: "Стоимость"
        list:
          - "Цены указаны в грузинских лари и относятся только к работе исполнителя"
          - "Государственные пошлины, услуги нотариуса и переводчика, банковские сборы оплачиваются отдельно по фактической стоимости"
          - "Полная смета сообщается до начала работы"
          - "Срочное обслуживание тарифицируется с надбавкой, указанной в прайсе"
      - h: "Что зависит не от исполнителя"
        p:
          - >-
            Решения по заявлениям принимают государственные органы.
            Исполнитель не гарантирует положительный результат и сроки
            рассмотрения, но обеспечивает полноту и корректность подготовки
            и своевременную реакцию на запросы.
      - h: "Обязанности заявителя"
        list:
          - "Предоставлять достоверные документы и сведения"
          - "Лично проходить те этапы, которые по закону не могут быть переданы (например, обязательное видео-собеседование)"
          - "Своевременно оплачивать государственные сборы"
      - h: "Конфиденциальность"
        p:
          - >-
            Полученные документы и данные используются только для согласованной
            процедуры. Подробнее — в политике конфиденциальности.

