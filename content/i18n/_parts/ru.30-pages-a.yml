  about:
    slug: "obo-mne"
    title: "Обо мне"
    nav_title: "Обо мне"
    kicker: "Кто я"
    seo_title: "Персональный менеджер по административным вопросам в Грузии"
    seo_description: >-
      Наталья, персональный кейс-менеджер в Грузии: сопровождение по ВНЖ, ИП,
      разрешению на работу, банку и налогам. Как я работаю и чего не делаю.
    body:
      - >-
        Меня зовут Наталья Церетели. Я живу в Грузии и работаю персональным менеджером
        по административным вопросам для иностранных граждан.
      - >-
        Ко мне приходят в двух состояниях. Первое — «только приехал(а),
        не понимаю, с чего начать». Второе — «попробовал(а) сам(а), получил(а)
        отказ или застрял(а)». В обоих случаях задача одна: превратить
        неопределённость в перечень конкретных шагов с датами.
      - >-
        Что я делаю: собираю и проверяю документы, заполняю заявления,
        организую перевод и нотариальное заверение, записываю на приёмы,
        общаюсь с государственными органами, отслеживаю рассмотрение заявлений,
        готовлю к собеседованиям, слежу за сроками действия документов.
      - >-
        Чего я не делаю: не представляю интересы в суде, не даю правовых
        заключений, не веду бухгалтерию и не обещаю решений, которые принимают
        государственные органы. Если нужна такая помощь, я скажу об этом сразу
        и порекомендую адвоката или аудитора, с которым уже работала.
      - >-
        Работаю в Тбилиси и Батуми, а по большинству вопросов — дистанционно.
        Общаюсь на русском и английском, с ведомствами — на грузинском.
    facts_title: "Коротко"
    facts:
      - k: "Где"
        v: "Тбилиси, Батуми"
      - k: "Языки"
        v: "RU · KA · EN"
      - k: "Статус"
        v: "Индивидуальный предприниматель, Грузия"
      - k: "Формат"
        v: "Онлайн и личные встречи"
    principles_title: "Правила, которых я держусь"
    principles:
      - "Называю полную стоимость до начала работы"
      - "Не беру дело, если не вижу законного пути к результату"
      - "Не обещаю сроков, которые устанавливает ведомство"
      - "Данные и документы клиентов не передаю третьим лицам без согласия"
      - "Говорю, когда задача решается без моего участия"

