      Tbilisi and Batumi. Consultations in Russian, Georgian and English.
    lead: >-
      The quickest way is a message on WhatsApp or Telegram: describe your
      situation briefly and what you need. I will tell you which basis fits
      and what it costs.
    note: >-
      Please don’t send scans of passports or other documents in your first
      message. We discuss the task first, then I tell you exactly
      what will be needed.
    no_form_title: "Message me directly"
    no_form_body: >-
      WhatsApp or Telegram is the fastest way. I reply during working hours, usually the same day.

  faq:
    slug: "faq"
    title: "Frequently asked questions"
    nav_title: "FAQ"
    kicker: "FAQ"
    seo_title: "Residence permit, IE and work permit in Georgia: FAQ"
    seo_description: >-
      Answers about administrative support: guarantees, my fee, state fees,
      when you must appear in person, processing times, refusals and renewals.
    lead: >-
      These are the questions people ask before we start. If yours is not
      here, write to me and I will add it.
    items:
      - q: "Are you a lawyer?"
        a: >-
          No. I am a personal manager for administrative matters:
          preparing and filing documents, dealing with government
          bodies, tracking deadlines. Legal opinions and representation
          in court are a lawyer's work.
      - q: "Can you guarantee I will be approved?"
        a: >-
          No. The decision is made by a government body. What I answer for is
          the quality of the preparation: a complete file, a correctly written
          application, deadlines met and fast replies to queries. That is what
          actually moves the outcome.
      - q: "What is included in the price and what is not?"
        a: >-
          The price covers my work: the consultation, checking and preparing
          documents, filling in applications, dealing with the agencies,
          keeping the process on track. It does not cover state fees, notary
          and translator services or bank charges — those are paid separately
          at actual cost.
      - q: "How long does it take to get a residence permit?"
        a: >-
          Processing times are set by the agency and they change, so I do not
          quote the "average figure from the internet". At the first
          consultation I give you the current time frame for your grounds, and
          what can stretch it — a request for extra documents, for example.
      - q: "I was refused. Can anything be done?"
        a: >-
          Often, yes. First we need to understand the reason for the refusal —
          sometimes it is a formality in the document set, sometimes the wrong
          grounds were chosen. I go through the situation and tell you whether
          it makes sense to reapply and what to change. If the matter becomes
          a legal one, we bring in a lawyer.
      - q: "Can everything be done remotely?"
        a: >-
          Partly. A lot is settled online, but there are steps the applicant
          takes in person: the compulsory online video interview for the right
          to work (the special labour permit), for instance, and some visits
          to government offices. I tell you in advance where you are needed.
      - q: "What is small business status with 1% tax?"
        a: >-
          It is a special tax regime for individual entrepreneurs in Georgia
          with turnover below a set threshold. It does not suit every kind of
          activity. At the consultation I explain whether you qualify, and what
          has to be done at registration in order to get it.
      - q: "Do you help with accounting and tax returns?"
        a: >-
          I help you register on the Revenue Service portal, set up your
          personal account there and I coordinate tax questions. Ongoing
          bookkeeping is a separate profession; if you need one, I will
          recommend an accountant.
      - q: "Do you work with families?"
        a: >-
          Yes. The Personal Manager and VIP Support packages include
          coordinating the administrative matters of family members —
          documents for children and spouses, and their permit deadlines.
      - q: "How do I pay?"
        a: >-
          Payment terms are agreed before we start and written into the contract.
          Monthly packages are paid month by month; one-off services follow
          an agreed schedule.
      - q: "What if I only need one procedure?"
        a: >-
          Take a single service from the price list: a document check, filling
          in an application, accompaniment to a government office, help with
          a bank account. A package makes sense when there are several tasks.
      - q: "Do you keep things confidential?"
        a: >-
          Yes. Documents and personal data are used only for the procedure
          they were given for, and are not passed to third parties without
          your consent — except where the law requires it.

  privacy:
    slug: "privacy"
    title: "Privacy policy"
    nav_title: "Privacy"
    seo_title: "Privacy policy"
    seo_description: >-
      What personal data this site collects when you send an enquiry about
