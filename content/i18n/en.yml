  about:
    slug: "about"
    title: "About me"
    nav_title: "About"
    kicker: "Who I am"
    seo_title: "About me — personal case manager for expats in Georgia"
    seo_description: >-
      Nata, personal case manager in Georgia. Administrative support for
      foreign nationals: residence permit, IE, work permit, banking, taxes.
      Not a lawyer.
    body:
      - >-
        My name is Natalia Tsereteli. I live in Georgia and I work as a personal manager
        handling administrative matters for foreign nationals.
      - >-
        People come to me in one of two states. The first is “I have just
        arrived and I don’t know where to start.” The second is “I tried on my
        own and was refused, or I am stuck.” In both cases the job is the same:
        to turn uncertainty into a list of concrete steps with dates.
      - >-
        What I do: I collect and check documents, fill in applications,
        arrange translation and notarisation, book appointments,
        deal with government offices, track how applications are progressing,
        prepare you for interviews, and watch the expiry dates on your documents.
      - >-
        What I don’t do: I don’t represent anyone in court, I don’t give legal
        opinions, I don’t keep your books and I don’t promise decisions that are
        made by government bodies. If you need that kind of help, I will say so
        straight away and recommend a lawyer or auditor I have worked with.
      - >-
        I work in Tbilisi and Batumi, and on most matters remotely.
        I speak Russian and English; with the agencies, Georgian.
    facts_title: "In brief"
    facts:
      - k: "Where"
        v: "Tbilisi, Batumi"
      - k: "Languages"
        v: "RU · KA · EN"
      - k: "Status"
        v: "Individual entrepreneur (sole proprietor), Georgia"
      - k: "Format"
