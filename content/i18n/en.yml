  work_permit:
    slug: "work-permit-georgia"
    name: "Right to work (special labour permit)"
    short: "A consultation, or full support through the procedure for a foreign national"
    service_type: "Support in obtaining the right to work"
    tagline: >-
      The applicant goes through the procedure in person — my job is to make
      sure they arrive prepared and with the right set of documents.
    summary: >-
      Administrative support through the process of obtaining the right to work
      (the special labour permit) for foreign nationals: identifying documents,
      checking the set, help with the electronic system and the payment,
      preparation for the mandatory online interview, tracking the review.
    seo_title: "Georgia work permit 2026: special labour permit support"
    seo_description: >-
      Right to work in Georgia: consultation from 100 ₾, full support from 300
      ₾. Documents, online application, the state fee and the mandatory video
      interview.
    duration: "Depends on the agency's processing time"
    format: "Online; the applicant attends the interview in person"
    for_whom:
      - >-
        You are a foreign national and you need to work legally in Georgia
        or take a job with a Georgian company.
      - >-
        You want to understand the whole procedure, or to hand it over
        and keep only the steps you have to do yourself.
    includes:
      - "Initial consultation and assessment of the situation"
      - "Identifying the documents and information required"
      - "Checking the documents you provide"
      - "Help filling in the application"
      - "Help registering and working with the electronic system"
      - "Arranging and tracking payment of the state service fee"
      - "Preparation for the mandatory online interview and an explanation of how it is conducted"
      - "Interpreter services arranged if needed"
      - "Tracking the review of the application"
      - "Liaising with the relevant government bodies as part of the support"
      - "Help if additional documents or information are requested"
      - "Informing you of the decision taken"
      - "Tracking the validity period of the right to work"
      - "Help preparing documents for renewal"
    excludes: >-
      The state fee for the service and interpreter services
      are paid separately.
    note: >-
      Important to know: documents are submitted to the Agency by the applicant
      personally, and the mandatory video interview is also attended in person.
      The service covers full administrative support with preparing and filing
      the documents and coordination of every stage of the procedure.
    steps:
      - "Assessment of the situation and the list of documents"
      - "Checking the set and filling in the application"
      - "Online application and payment of the state service fee"
      - "Preparation for the video interview"
      - "Tracking the review and informing you of the decision"
    result: >-
      A correctly filed application, an interview you are ready for
      and tracking of the validity period of the permit granted.
    faq:
      - q: "How does a consultation differ from full support?"
        a: >-
          A consultation is an assessment of your situation, the list of
          documents, an explanation of the procedure and timelines and
          instructions for filling in the application: after that you act on
          your own. Full support means I run the process: I check the documents,
          help with the application and the online filing, coordinate the
          payment, prepare you for the interview and track the review.
      - q: "Can you attend the interview instead of me?"
        a: >-
          No. The mandatory video interview is attended by the applicant
          in person, that is a requirement of the procedure. I prepare you
          for it: I explain the format, the usual questions and arrange
          an interpreter if needed.
      - q: "Do I need a residence permit to get the right to work?"
        a: >-
          These are separate procedures, but they often run together and the
          order matters. At the consultation I will tell you which one makes
          more sense to do first in your case.
      - q: "Who needs the right to work in Georgia?"
        a: >-
          The requirement applies from 1 March 2026 to foreigners without
          permanent residence who work or run a business in Georgia: employees
          of Georgian companies, individual entrepreneurs and freelancers.
          It does not apply to holders of permanent or investment residence
          permits, refugees and persons under international protection,
          accredited diplomats and journalists. Annual quotas apply to some
          occupations — couriers, taxi drivers and guides.
      - q: "How much is the state fee and how long does the review take?"
        a: >-
          The standard procedure is 200 ₾ and up to 30 calendar days,
          the expedited one is 400 ₾ and up to 10 working days. This is
          the Employment Agency's fee, separate from the cost of the support.
          For an employee the application is filed and the fee paid by
          the employer; the self-employed file and pay themselves.
      - q: "What happens if you work without the permit?"
        a: >-
          A fine of 2000 ₾ for the foreigner and 2000 ₾ for the employer
          or the organiser of the service — for each person working without
          the right. For the self-employed who worked in Georgia before
          the rules came in, enforcement applies from 1 May 2026,
          and registered labour immigrants must obtain the right
          by 1 January 2027.
      - q: "I am a sole entrepreneur working only with foreign clients. Do I need it?"
        a: >-
          The most disputed question of the new rules: there is no official
          clarification and even specialised lawyers read it differently.
          The answer depends on the details: whether the activity is registered
          in Georgia, where the clients are, whether there is Georgian income.
          At a consultation I go through your specific situation and give
          a clear plan of action rather than one-size-fits-all advice.
      - q: "For how long is the right granted and how is it renewed?"
        a: >-
          The initial right is granted for 6 months to a year, for IT
          specialists — up to 3 years. It is renewed for a year at a time
          during the first five years, then for up to 5 years at once.
          Renewal documents are filed no later than 30 days before expiry —
          the reminder is part of the support.

