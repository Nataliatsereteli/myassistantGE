      - "მთელი პროცესის სრული კონტროლი"
    excludes: >-
      სახელმწიფო ბაჟები, ნოტარიუსისა და თარჯიმნის მომსახურება და საბანკო
      მოსაკრებლები ცალკე, ფაქტობრივი ღირებულებით ანაზღაურდება.
    steps:
      - "ვარკვევთ მოდელს: რას საქმიანობთ, საიდან შემოდის შემოსავალი, ვინ არიან კლიენტები"
      - "ინდმეწარმის რეგისტრაცია და საგადასახადო რეჟიმი"
      - "შემოსავლების სამსახურის პირადი კაბინეტი, ბანკი"
      - "შრომითი საქმიანობის უფლება და განაცხადი ბინადრობაზე"
    result: >-
      რეგისტრირებული სტატუსი, მოქმედი პირადი კაბინეტი შემოსავლების სამსახურში,
      გახსნილი ანგარიში და შეტანილი განაცხადი ბინადრობის ნებართვაზე.
    faq:
      - q: "იძლევით თუ არა საბანკო ანგარიშის გახსნის გარანტიას?"
        a: >-
          არა — გადაწყვეტილებას ბანკი იღებს და თითოეულს უცხოელი კლიენტების
          მიმართ თავისი მოთხოვნები აქვს. პაკეტს ისე ვამზადებ, რომ კითხვები
          ნაკლები დარჩეს, თან ვახლავარ პროცესს და თუ ერთმა ბანკმა უარი თქვა,
          შემდეგს გთავაზობთ.
      - q: "რით განსხვავდება ეს პაკეტისგან «სტარტი საქართველოში»?"
        a: >-
          «სტარტი» მხოლოდ ინდმეწარმის რეგისტრაციაა. აქ მას ემატება გადასახადები,
          პირადი კაბინეტი, ბანკი, შრომითი საქმიანობის უფლება და განაცხადი
          ბინადრობაზე, ანუ მთელი ადმინისტრაციული კონტური.
      - q: "და თუ ინდმეწარმე უკვე მაქვს?"
        a: >-
