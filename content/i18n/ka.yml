# =============================================================================
#  РУССКАЯ ВЕРСИЯ САЙТА — весь текст на одном языке в одном файле.
#
#  Как править:
#   * меняйте только то, что справа от двоеточия;
#   * если строка начинается с "- ", это пункт списка: можно добавлять и удалять;
#   * сохраняйте отступы (только пробелы, не табуляция);
#   * текст с двоеточием или кавычками внутри — берите в кавычки: "Вот так: да";
#   * длинный текст можно писать блоком через >- (см. примеры ниже).
#
#  ЦЕНЫ здесь не указываются — они в content/pricing.yml (один раз для всех языков).
#  КОНТАКТЫ здесь не указываются — они в content/contacts.yml.
# =============================================================================

