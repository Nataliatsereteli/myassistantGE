    tagline: >-
      თქვენ აგროვებთ პირად დოკუმენტებს — ბინადრობის ნებართვის
      განცხადებაზე დანარჩენ ყველაფერს მე ვაკეთებ.
    summary: >-
      ბინადრობის ნებართვის მიღების პროცესის სრული ადმინისტრაციული თანხლება:
      დოკუმენტების შემოწმება, განცხადების მომზადება, თარგმანისა და ნოტარიული
      დამოწმების ორგანიზება, სახელმწიფო უწყებებთან კომუნიკაცია და განხილვის
      კონტროლი.
    seo_title: "ბინადრობის ნებართვა საქართველოში — წარდგენის თანხლება"
    seo_description: >-
      ბინადრობის ნებართვა საქართველოში: დოკუმენტების შემოწმება, განცხადების
      მომზადება, თარგმანი და ნოტარიული დამოწმება, წარდგენა და განხილვის
      კონტროლი.
