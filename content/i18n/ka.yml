      - "თანხლების ფარგლებში შესაბამის სახელმწიფო უწყებებთან ურთიერთობა"
      - "დამატებითი დოკუმენტების ან ინფორმაციის მოთხოვნის შემთხვევაში დახმარება"
      - "მიღებული გადაწყვეტილების შესახებ ინფორმირება"
      - "შრომითი საქმიანობის უფლების მოქმედების ვადის კონტროლი"
      - "გაგრძელებისთვის დოკუმენტების მომზადებაში დახმარება"
    excludes: >-
      მომსახურების სახელმწიფო ბაჟი და თარჯიმნის მომსახურება
      ცალკე იხდება.
    note: >-
      მნიშვნელოვანია იცოდეთ: დოკუმენტებს სააგენტოში უშუალოდ განმცხადებელი
      წარადგენს და სავალდებულო ვიდეო გასაუბრებასაც პირადად გადის.
      მომსახურება მოიცავს დოკუმენტების მომზადებისა და წარდგენის სრულ
      ადმინისტრაციულ თანხლებას და პროცედურის ყველა ეტაპის კოორდინაციას.
    steps:
      - "სიტუაციის შეფასება და დოკუმენტების ჩამონათვალი"
      - "პაკეტის შემოწმება და განცხადების შევსება"
      - "ელექტრონული განაცხადი და სახელმწიფო მომსახურების გადახდა"
      - "ვიდეო გასაუბრებისთვის მომზადება"
      - "განხილვის კონტროლი და გადაწყვეტილების შესახებ ინფორმირება"
    result: >-
      სწორად წარდგენილი განცხადება, მომზადებული გასაუბრება
      და მოპოვებული უფლების მოქმედების ვადის კონტროლი.
    faq:
      - q: "რით განსხვავდება კონსულტაცია თანხლებისგან?"
        a: >-
          კონსულტაცია არის თქვენი სიტუაციის შეფასება, დოკუმენტების ჩამონათვალი,
          პროცედურისა და ვადების განმარტება და განცხადების შევსების ინსტრუქცია:
          შემდეგ თავად მოქმედებთ. თანხლება არის მაშინ, როცა პროცესს მე ვუძღვები:
          ვამოწმებ დოკუმენტებს, გეხმარებით განცხადებასა და ელექტრონულ განაცხადში,
          ვაკოორდინირებ გადახდას, გამზადებთ გასაუბრებისთვის და თვალს ვადევნებ განხილვას.
      - q: "შეიძლება თუ არა გასაუბრება ჩემ ნაცვლად გაიაროთ?"
        a: >-
          არა. სავალდებულო ვიდეო გასაუბრებას განმცხადებელი პირადად გადის,
          ეს პროცედურის მოთხოვნაა. მე გამზადებთ მისთვის: აგიხსნით წესს,
          ტიპურ კითხვებს და საჭიროების შემთხვევაში თარჯიმანს მოვაწყობ.
      - q: "საჭიროა თუ არა ბინადრობის ნებართვა შრომის უფლებისთვის?"
        a: >-
          ეს სხვადასხვა პროცედურაა, მაგრამ ხშირად ერთად მიდის და თანმიმდევრობას
          მნიშვნელობა აქვს. კონსულტაციაზე გეტყვით, თქვენს შემთხვევაში რომელი
          უფრო ლოგიკურია პირველი გააკეთოთ.
      - q: "ვის სჭირდება შრომითი საქმიანობის უფლება?"
        a: >-
          მოთხოვნა მოქმედებს 2026 წლის 1 მარტიდან და ეხება მუდმივი ბინადრობის
          ნებართვის არმქონე უცხოელებს, რომლებიც საქართველოში მუშაობენ
          ან სამეწარმეო საქმიანობას ეწევიან: ქართული კომპანიების დასაქმებულებს,
          ინდივიდუალურ მეწარმეებსა და ფრილანსერებს. ის არ ვრცელდება მუდმივი
          და საინვესტიციო ბინადრობის ნებართვის მფლობელებზე, ლტოლვილებზე
          და საერთაშორისო დაცვის ქვეშ მყოფ პირებზე, აკრედიტებულ დიპლომატებსა
          და ჟურნალისტებზე. ზოგიერთ საქმიანობაზე — კურიერები, ტაქსის მძღოლები,
          გიდები — წლიური კვოტები მოქმედებს.
      - q: "რა ღირს სახელმწიფო მომსახურება და რამდენ ხანს განიხილავენ?"
        a: >-
          სტანდარტული წესით — 200 ₾ და 30 კალენდარულ დღემდე, დაჩქარებულით —
          400 ₾ და 10 სამუშაო დღემდე. ეს დასაქმების სააგენტოს ბაჟია
          და თანხლების ღირებულებაში არ შედის. დასაქმებულისთვის განცხადებას
          დამსაქმებელი წარადგენს და ბაჟსაც ის იხდის, თვითდასაქმებული კი
          თავად წარადგენს და იხდის.
      - q: "რა მოხდება, თუ უფლების გარეშე იმუშავებთ?"
        a: >-
          ჯარიმა 2000 ₾ უცხოელს და 2000 ₾ დამსაქმებელს ან მომსახურების
          ორგანიზატორს — უფლების გარეშე მომუშავე თითოეულ პირზე.
          თვითდასაქმებულებისთვის, რომლებიც წესების შემოღებამდე მუშაობდნენ
          საქართველოში, კონტროლი 2026 წლის 1 მაისიდან მოქმედებს, ხოლო
          რეგისტრირებულმა შრომითმა იმიგრანტებმა უფლება 2027 წლის
          1 იანვრამდე უნდა მოიპოვონ.
      - q: "ინდმეწარმე ვარ და მხოლოდ უცხოელ დამკვეთებთან ვმუშაობ. მჭირდება უფლება?"
        a: >-
          ახალი წესების ყველაზე სადავო კითხვაა: ოფიციალური განმარტება
          არ არსებობს და პროფილურ იურისტებსაც კი სხვადასხვანაირად ესმით.
          პასუხი დეტალებზეა დამოკიდებული: რეგისტრირებულია თუ არა საქმიანობა
          საქართველოში, სად არიან დამკვეთები, არის თუ არა ქართული შემოსავალი.
          კონსულტაციაზე კონკრეტულად თქვენს სიტუაციას განვიხილავ და გასაგებ
          სამოქმედო გეგმას მოგცემთ.
      - q: "რა ვადით გაიცემა უფლება და როგორ გრძელდება?"
        a: >-
          პირველადი უფლება გაიცემა 6 თვიდან 1 წლამდე ვადით,
          IT-სპეციალისტებისთვის — 3 წლამდე. პირველი ხუთი წლის განმავლობაში
          ის ერთი წლით გრძელდება, შემდეგ — ერთდროულად 5 წლამდე.
          გაგრძელების დოკუმენტები ვადის ამოწურვამდე არაუგვიანეს 30 დღისა
          წარდგება — ამის შეხსენება თანხლების ნაწილია.

