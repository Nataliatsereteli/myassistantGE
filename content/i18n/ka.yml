  faq:
    slug: "kitkhvebi"
    title: "ხშირად დასმული კითხვები"
    nav_title: "კითხვები"
    kicker: "FAQ"
    seo_title: "ბინადრობა, ინდმეწარმე, შრომის უფლება — ხშირი კითხვები"
    seo_description: >-
      ვპასუხობ კითხვებს თანხლების შესახებ: გარანტიები, ღირებულება,
      სახელმწიფო ბაჟი, პირადი გამოცხადება, ვადები, უარები და ბინადრობის გაგრძელება.
    lead: >-
      აქ შევკრიბე ის, რასაც მუშაობის დაწყებამდე ყველაზე ხშირად მეკითხებიან.
      თუ თქვენი კითხვა აქ არ არის — მომწერეთ, დავამატებ.
    items:
      - q: "იურისტი ან ადვოკატი ხართ?"
        a: >-
          არა. მე ვარ პერსონალური მენეჯერი ადმინისტრაციულ საკითხებში:
          დოკუმენტების მომზადება და წარდგენა, სახელმწიფო უწყებებთან
          კომუნიკაცია, ვადების კონტროლი. სამართლებრივი დასკვნები და
          სასამართლოში წარმომადგენლობა ადვოკატის საქმეა.
      - q: "შეგიძლიათ დადებითი გადაწყვეტილების გარანტია მომცეთ?"
        a: >-
          არა. გადაწყვეტილებას სახელმწიფო უწყება იღებს. მე ვაგებ პასუხს
          მომზადების ხარისხზე: სრული პაკეტი, სწორად შევსებული განაცხადი,
          დაცული ვადები და სწრაფი რეაგირება მოთხოვნებზე. სწორედ ეს მოქმედებს შედეგზე.
      - q: "რა შედის ფასში და რა — არა?"
        a: >-
          ფასში შედის ჩემი მუშაობა: კონსულტაცია, დოკუმენტების შემოწმება და
          მომზადება, განაცხადების შევსება, უწყებებთან კომუნიკაცია, პროცესის
          კონტროლი. არ შედის სახელმწიფო ბაჟი, ნოტარიუსისა და თარჯიმნის
          მომსახურება, საბანკო საკომისიოები — ისინი ცალკე იხდება
          ფაქტობრივი ღირებულებით.
      - q: "რამდენი დრო სჭირდება ბინადრობის ნებართვის მიღებას?"
        a: >-
          განხილვის ვადებს უწყება ადგენს და ისინი იცვლება, ამიტომ არ ვასახელებ
          „ინტერნეტში საშუალო“ ციფრებს. პირველივე კონსულტაციაზე გეუბნებით
          აქტუალურ ვადას თქვენი საფუძვლისთვის და იმას, რამაც შეიძლება
          გააჭიანუროს — მაგალითად, დამატებითი დოკუმენტების მოთხოვნა.
      - q: "უარი მივიღე. შეიძლება რამის გაკეთება?"
        a: >-
          ხშირად კი. ჯერ უარის მიზეზი უნდა გავარკვიოთ — ზოგჯერ ეს
          ფორმალური ხარვეზია დოკუმენტების პაკეტში, ზოგჯერ არასწორი საფუძველი.
          ვარკვევ სიტუაციას და გეუბნებით, აქვს თუ არა აზრი ხელახლა წარდგენას
          და რა უნდა შეიცვალოს. თუ საკითხი სამართლებრივ სიბრტყეში გადადის,
          ადვოკატს ვრთავთ.
      - q: "შესაძლებელია ყველაფრის დისტანციურად მოგვარება?"
        a: >-
          ნაწილობრივ. ბევრი რამ ონლაინ წყდება, მაგრამ არის ნაბიჯები, რომლებსაც
          განმცხადებელი პირადად გადის: მაგალითად, სავალდებულო ვიდეო-გასაუბრება
          შრომითი საქმიანობის უფლების მიღებისას და ვიზიტების ნაწილი
          სახელმწიფო დაწესებულებებში. წინასწარ გეუბნებით, სად ხართ საჭირო თავად.
      - q: "რა არის მცირე ბიზნესის სტატუსი 1% გადასახადით?"
        a: >-
          ეს არის სპეციალური საგადასახადო რეჟიმი ინდივიდუალური მეწარმეებისთვის
          საქართველოში, რომელთა ბრუნვაც დადგენილ ზღვარს არ აღემატება. ის ყველა
          საქმიანობის სახეს არ ერგება. კონსულტაციაზე ვხსნი, ექცევით თუ არა მასში
          და რა უნდა გააკეთოთ რეგისტრაციისას, რომ მიიღოთ.
      - q: "ბუღალტრიასა და დეკლარაციებში ეხმარებით?"
        a: >-
          გეხმარებით შემოსავლების სამსახურის პორტალზე რეგისტრაციაში, პირადი
          კაბინეტის გამართვაში და ვაკოორდინირებ საგადასახადო საკითხებს.
          რეგულარული ბუღალტრია ცალკე პროფესიაა; საჭიროების შემთხვევაში
          ბუღალტერს გირჩევთ.
      - q: "ოჯახებთან მუშაობთ?"
        a: >-
          დიახ. პაკეტებში „პერსონალური მენეჯერი“ და „VIP-მხარდაჭერა“
          შედის ოჯახის წევრების ადმინისტრაციული საკითხების კოორდინაცია —
          ბავშვებისა და მეუღლის დოკუმენტები, მათი ნებართვების ვადები.
      - q: "როგორ ხდება გადახდა?"
        a: >-
          გადახდის წესი მუშაობის დაწყებამდე განიხილება და ხელშეკრულებაში ფიქსირდება.
          თვიური პაკეტების შემთხვევაში გადახდა ყოველთვიურია, ერთჯერადი
          მომსახურებისთვის — შეთანხმებული გრაფიკით.
      - q: "და თუ მხოლოდ ერთი პროცედურა მჭირდება?"
        a: >-
          აიღეთ ცალკეული მომსახურება ფასების სიიდან: დოკუმენტების შემოწმება,
          განაცხადის შევსება, თანხლება სახელმწიფო დაწესებულებაში, დახმარება
          საბანკო ანგარიშთან. პაკეტს მაშინ აქვს აზრი, როცა ამოცანა რამდენიმეა.
      - q: "კონფიდენციალურობას იცავთ?"
        a: >-
          დიახ. დოკუმენტები და პერსონალური მონაცემები გამოიყენება მხოლოდ იმ
          პროცედურისთვის, რისთვისაც გადმომეცა, და მესამე პირებს არ გადაეცემა
          თქვენი თანხმობის გარეშე — გარდა იმ შემთხვევებისა, როცა ამას
          კანონმდებლობა მოითხოვს.

  privacy:
    slug: "konfidentsialuroba"
    title: "კონფიდენციალურობის პოლიტიკა"
    nav_title: "კონფიდენციალურობა"
    seo_title: "კონფიდენციალურობის პოლიტიკა"
    seo_description: >-
      რა მონაცემებს აგროვებს საიტი, რისთვის და როგორ ხდება მათი დამუშავება,
      ვის გადაეცემა, რამდენ ხანს ინახება და როგორ მოითხოვოთ წაშლა.
    updated: "2026"
    body:
      - h: "ვინ ამუშავებს მონაცემებს"
        p:
          - >-
            საიტი ეკუთვნის ინდივიდუალურ მეწარმეს, რომელიც საქართველოში
            ადმინისტრაციული თანხლების მომსახურებას უწევს კლიენტებს.
            საკონტაქტო მონაცემები მითითებულია გვერდზე „კონტაქტი“.
      - h: "რა მონაცემები გროვდება"
        p:
          - >-
            საიტი სტატიკურია და თავისთავად არ ქმნის ანგარიშებს
            და არ ინახავს ვიზიტორთა ბაზას. მონაცემები ჩნდება მხოლოდ მაშინ,
            როცა თქვენ თვითონ აგზავნით მათ.
        list:
          - "სახელი და კავშირის საშუალება, თუ შეავსეთ განაცხადის ფორმა"
          - "თქვენი შეტყობინების ტექსტი"
          - "გვერდის ენა და იმ გვერდის მისამართი, საიდანაც გაიგზავნა განაცხადი"
          - "ვიზიტების პერსონიფიცირების გარეშე სტატისტიკა, თუ ანალიტიკა ჩართულია"
      - h: "რისთვის"
        p:
          - >-
            ერთადერთი მიზანი — გიპასუხოთ და გაგიწიოთ ის მომსახურება,
            რომელზეც მეკითხებით. მონაცემები არ გამოიყენება რეკლამისთვის და არ იყიდება.
      - h: "ვის გადაეცემა"
        list:
          - "ფორმის გაგზავნის სერვისს — მხოლოდ იმისთვის, რომ წერილი ჩამოვიდეს"
          - "სახელმწიფო ორგანოებს, ნოტარიუსს, თარჯიმანს ან ბანკს — მხოლოდ თქვენი პროცედურისთვის საჭირო მოცულობით და მხოლოდ თქვენი თანხმობით"
          - "სხვა არავის"
      - h: "რამდენ ხანს ინახება"
        p:
          - >-
            მიმოწერა და დოკუმენტები ინახება იმდენ ხანს, რამდენიც საჭიროა
            მომსახურების გასაწევად და კანონმდებლობის მოთხოვნების შესასრულებლად,
            შემდეგ კი იშლება.
      - h: "თქვენი უფლებები"
        p:
          - >-
            შეგიძლიათ მთხოვოთ თქვენი მონაცემების ჩვენება, შესწორება ან წაშლა —
            მომწერეთ საკონტაქტო მისამართზე და ამას გავაკეთებ.
      - h: "Cookies"
        p:
          - >-
            საიტი არ იყენებს სარეკლამო cookies-ს. არჩეული ენა
            ინახება ბრაუზერის ლოკალურ მეხსიერებაში, რომ ყოველ ჯერზე
            აღარ იკითხოს; ეს არავის გადაეცემა.

  terms:
    slug: "pirobebi"
    title: "მომსახურების გაწევის პირობები"
    nav_title: "პირობები"
    seo_title: "მომსახურების გაწევის პირობები"
    seo_description: >-
      რა შედის ადმინისტრაციული თანხლების მომსახურებაში, რა არ შედის, როგორ
      ყალიბდება ღირებულება ლარში და სად გადის პასუხისმგებლობის საზღვრები.
    updated: "2026"
    body:
      - h: "მომსახურების ხასიათი"
        p:
          - >-
            ხორციელდება ადმინისტრაციული თანხლების მომსახურება —
            კონსულტირება პროცედურაზე, დოკუმენტების მომზადება და შემოწმება,
            განცხადებების შევსება, სახელმწიფო ორგანოებთან ურთიერთობა
            თანხლების ფარგლებში, ვადების კონტროლი.
          - >-
            მომსახურება არ არის იურიდიული დახმარება სასამართლოში
            წარმომადგენლობის გაგებით და არ მოიცავს სამართლებრივ დასკვნებს.
            საჭიროების შემთხვევაში რეკომენდებულია ადვოკატისთვის მიმართვა.
      - h: "ღირებულება"
        list:
          - "ფასები მითითებულია ქართულ ლარში და ეხება მხოლოდ შემსრულებლის მუშაობას"
          - "სახელმწიფო ბაჟი, ნოტარიუსისა და თარჯიმნის მომსახურება, საბანკო საკომისიოები ანაზღაურდება ცალკე, ფაქტობრივი ღირებულებით"
          - "სრული ხარჯთაღრიცხვა ცნობილი ხდება სამუშაოს დაწყებამდე"
          - "სასწრაფო მომსახურება ფასდება პრაისში მითითებული დანამატით"
      - h: "რა არ არის დამოკიდებული შემსრულებელზე"
        p:
          - >-
            განცხადებებზე გადაწყვეტილებას იღებენ სახელმწიფო ორგანოები.
            შემსრულებელი არ იძლევა დადებითი შედეგისა და განხილვის ვადების
            გარანტიას, მაგრამ უზრუნველყოფს მომზადების სისრულესა და სისწორეს
            და დროულ რეაგირებას შემოსულ მოთხოვნებზე.
      - h: "განმცხადებლის ვალდებულებები"
        list:
          - "წარადგინოს უტყუარი დოკუმენტები და ინფორმაცია"
          - "პირადად გაიაროს ის ეტაპები, რომლებიც კანონით სხვას ვერ გადაეცემა (მაგალითად, სავალდებულო ვიდეო-გასაუბრება)"
          - "დროულად გადაიხადოს სახელმწიფო მოსაკრებლები"
      - h: "კონფიდენციალურობა"
        p:
          - >-
            მიღებული დოკუმენტები და მონაცემები გამოიყენება მხოლოდ შეთანხმებული
            პროცედურისთვის. დეტალები — კონფიდენციალურობის პოლიტიკაში.

