    format: "ონლაინ + თანხლება წარდგენისას"
    for_whom:
      - >-
        გჭირდებათ ბინადრობის ნებართვა და გინდათ, რომ განცხადება პირველივე
        ჯერზე გავიდეს — დოკუმენტის ფორმის, თარგმანის ან არასწორად მითითებული
        საფუძვლის გამო დაბრუნების გარეშე.
      - >-
        ან უკვე თავად წარადგინეთ, უარი მიიღეთ და ვერ გაარკვიეთ,
        კონკრეტულად რა უნდა გამოასწოროთ.
    includes:
      - "საჭირო დოკუმენტების შემოწმება"
      - "განცხადების მომზადება"
      - "დოკუმენტების თარგმანისა და ნოტარიული დამოწმების ორგანიზება"
      - "სახელმწიფო უწყებებთან კომუნიკაცია"
      - "განცხადების წარდგენის პროცესის თანხლება"
      - "განცხადების განხილვის პროცესის კონტროლი"
      - "დახმარება დამატებითი დოკუმენტების მოთხოვნის შემთხვევაში"
    excludes: >-
      სახელმწიფო ბაჟი, თარჯიმნის, ნოტარიუსისა და მესამე პირების სხვა ხარჯები
      მომსახურების ღირებულებაში არ შედის.
    steps:
      - "ვადგენთ საფუძველს, რომლითაც ბინადრობის ნებართვა თქვენთვის ხელმისაწვდომია"
      - "ვამოწმებთ პაკეტს და სუსტ ადგილებს წარდგენამდე ვპოულობთ"
      - "თარგმანები, ნოტარიუსი, განცხადება"
      - "წარდგენა და კონტროლი გადაწყვეტილებამდე"
    result: >-
      წარდგენილი განცხადება სრული პაკეტით, თვალყურდევნებადი სტატუსი
      და სწრაფი რეაქცია, თუ უწყება დამატებით რამეს მოითხოვს.
    note: >-
      თუ თქვენი საფუძვლით ბინადრობის ნებართვის მიღება შეუძლებელია, ამას
      სამუშაოს დაწყებამდე გეტყვით და ალტერნატივას შემოგთავაზებთ — „იღბალზე“ არ ვაბარებ.
    faq:
      - q: "რომელი საფუძველი გამომადგება ბინადრობის ნებართვისთვის?"
        a: >-
          საფუძველი რამდენიმეა — სამუშაო, სწავლა, ბიზნესი, ოჯახი, უძრავი ქონება
          და სხვა. რომელი გამოგადგებათ, დამოკიდებულია მოქალაქეობაზე, შემოსავალზე,
          ოჯახურ მდგომარეობასა და გეგმებზე. სწორედ ეს არის პირველი გასარკვევი.
      - q: "რა ვქნა, თუ დამატებითი დოკუმენტები მოითხოვეს?"
        a: >-
          ეს პროცედურის ნორმალური ნაწილია. მოთხოვნას ვიღებ, გიხსნით, კონკრეტულად
          რა არის საჭირო, გეხმარებით სწრაფად შეგროვებასა და დაგზავნაში — რომ ვადა არ დაიწვას.
      - q: "შედის თუ არა გაგრძელება ამ მომსახურებაში?"
        a: >-
          ეს მომსახურება ერთ წარდგენას ფარავს. მოქმედების ვადებს პაკეტებში
          „პერსონალური მენეჯერი“ და „VIP-თანხლება“ ვაკონტროლებ,
          ან გაგრძელების ცალკე შეკვეთაც შეიძლება.

